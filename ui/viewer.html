<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PicShow</title>

    <!--
      主题必须在**样式表之前**定下来 —— 这是「加载时闪一下浅色」的唯一解药。

      浏览器拿到 HTML 之后，样式表一到位就会按当时的 `data-theme` 画第一帧。
      如果把这个决定推迟到 JS 模块加载完（哪怕是首屏脚本），中间那一帧就是
      系统默认色：深色主题的用户会看到一次白闪。

      所以这里是**同步内联**脚本，不 defer、不 module、不 import、不 await：
      它在 CSS 之前跑完，第一帧就带着正确的 `data-theme`。

      两处细节：
        * 底色也临时写在 `<html>` 上 —— 连 CSS 都还没到的那几十毫秒里，
          浏览器给的是自己的默认白底，只有这一个办法能压住；
          ui/js/theme.js 启动后会把它摘掉，交还给 CSS。
        * 这两个十六进制必须和 CSS 令牌里的 `--bg` 同值：
          check_tokens.mjs 会比对，改了一半就报错。

      这段必须与 index.html 头部**逐字相同**：两个窗口是两个 webview，
      各画各的第一帧，谁漏了谁就闪。check_tokens.mjs 会核对两份。
    -->
    <script>
      (function () {
        var pref = 'dark';
        try {
          var saved = localStorage.getItem('picshow.theme');
          if (saved === 'light' || saved === 'dark') pref = saved;
        } catch (e) {
          /* 存储不可用就用默认深色 */
        }
        var root = document.documentElement;
        root.dataset.theme = pref;
        root.style.colorScheme = pref;
        root.style.backgroundColor = pref === 'light' ? '#f4f5f7' : '#0b0b0d';
      })();
    </script>

    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body class="is-immersive">
    <!--
      灯箱预览的**全部** DOM。

      这个页面里没有顶栏、没有网格、没有空状态 —— 那些属于图片墙，住在
      `index.html` 里、跑在 `main` 那条窗口上。预览是**另一个物理窗口**
      （`viewer`），两个 webview 之间没有共享的 JS 上下文，图片集合只能靠
      后端中转（见 `commands::viewer_boot`）。

      分家换来的是：图片墙那条窗口一次全屏都没进过、一次几何都没被写过，
      所以它根本不存在「退出预览要还原到什么」这个问题 —— 它就待在用户最后
      摆放的位置上。
    -->
    <!--
      tabindex="-1"：预览视图要能**被程序聚焦**但不进入 Tab 遍历。
      预览窗口是隐藏建起来的，webview 不是第一响应者，不显式抢一次焦点，
      方向键就得等用户先点一下画面（见 Viewer#focusView）。
    -->
    <div id="viewer" class="viewer" tabindex="-1" hidden>
      <div class="viewer-backdrop"></div>
      <div class="viewer-stage"></div>

      <div class="viewer-chrome">
        <!--
          标题栏。它就是屏幕上唯一的标题栏：左边关闭、中间文件名与序号、
          右边工具，空白处可拖动窗口。它的显隐与下面「上一张/下一张」按钮、
          底部胶片条共用同一套计时。
        -->
        <div id="viewer-bar" class="viewer-bar">
          <button class="icon-btn viewer-close" type="button" title="关闭 (Esc)" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" /></svg>
          </button>

          <div class="viewer-meta">
            <span id="viewer-title" class="viewer-title"></span>
            <span id="viewer-counter" class="viewer-counter"></span>
          </div>

          <div class="viewer-drag" data-tauri-drag-region></div>

          <div class="viewer-tools">
            <button class="icon-btn zoom-out" type="button" title="缩小 (-)" aria-label="缩小">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
            </button>
            <button id="viewer-zoom" class="viewer-zoom" type="button" title="适应窗口 (0)">100%</button>
            <button class="icon-btn zoom-in" type="button" title="放大 (+)" aria-label="放大">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
            </button>
            <button class="icon-btn reveal" type="button" title="在文件管理器中显示" aria-label="在文件管理器中显示">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5l2 2h9v10H4z" /></svg>
            </button>
            <!-- 预览界面里顶栏不存在，所以主题开关必须在这一页也有一份 -->
            <button
              id="btn-theme-viewer"
              class="icon-btn theme-toggle"
              type="button"
              title="切换到浅色主题"
              aria-label="切换到浅色主题"
            >
              <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2" />
                <path
                  d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"
                />
              </svg>
              <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a7.3 7.3 0 1 0 10.8 10.8z" />
              </svg>
            </button>
          </div>
        </div>

        <button class="nav-btn prev" type="button" title="上一张 (←)" aria-label="上一张">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" /></svg>
        </button>
        <button class="nav-btn next" type="button" title="下一张 (→)" aria-label="下一张">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" /></svg>
        </button>

        <!-- 胶片条：缩略图列表，点击直接跳转 -->
        <div id="viewer-strip" class="viewer-strip">
          <div id="strip-inner" class="strip-inner"></div>
        </div>
      </div>
    </div>

    <!-- 仅在「用普通浏览器打开开发服务器」时出现 -->
    <div id="host-warning" class="host-warning" hidden>
      <b>这里不是 PicShow 的运行环境。</b><br />
      <code>localhost:1420</code> 是 Tauri 内部加载前端用的开发服务器，
      在普通浏览器里没有后端注入，所有命令都不可用。<br />
      请运行 <code>npm run dev</code>，并在弹出的<b>桌面窗口</b>中使用。
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="./js/viewer-main.js"></script>
  </body>
</html>
