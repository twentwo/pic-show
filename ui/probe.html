      const W17 = viewer.slotWidth();
      const mid17 = -1.35 * W17; // 画面停在「两张图各露一部分」
      viewer.switching = true; // go() 还没结束
      viewer.g.enabled = false; // 动画期间的闸门
      viewer.slotIndex = 2; // 目标槽已经从右边推进来
      viewer.trackOffset = -2 * W17;
      viewer.track.style.transform = `translate3d(${mid17}px, 0, 0)`;
      let cancelled17 = false;
      viewer.trackAnim = {
        playState: 'running',
        cancel() {
          cancelled17 = true;
        }
      };

      await sleep(16);
      wheel({ deltaX: 40, deltaY: 0 }); // 只推 40px：远不够翻页
      await sleep(16);
      ok(
        '17.14a 起手就接管（还在跑的收尾动画被取消）',
        cancelled17 && viewer.trackAnim === null,
        `cancelled=${cancelled17} trackAnim=${String(viewer.trackAnim)}`
      );
      ok(
        '17.14b 接管后画面从刚才停的位置继续跟手（不跳、也不被关键帧盖住）',
        Math.abs(visualX(viewer.track) - (mid17 - 40)) < 2,
        `视觉 ${visualX(viewer.track).toFixed(1)}，期望 ${(mid17 - 40).toFixed(1)}`
      );
      ok(
        '17.14c 接管后立刻解除 switching / enabled（不必再等一次动画）',
        viewer.switching === false && viewer.g.enabled === true,
        `switching=${viewer.switching} enabled=${viewer.g.enabled}`
      );
      ok(
        '17.14d 接管偏移不参与阈值（只推了 40px，不该结算）',
        viewer.index === 2,
        String(viewer.index)
      );
      await settle(300);

      // 17.14e 连续三次「切到一半就再起手」：每一段都必须重新对齐。
      //       每轮只推 12px（40ms 一帧）：低于「擦过 28px + 峰值速度」的结算
      //       门槛，避免异步的 go() 插手，这样纯粹检验接管的视觉连续性。
      await twOpen(1);
      let drift17 = 0;
      const trace17 = [];
      for (let i = 0; i < 3; i += 1) {
        const W = viewer.slotWidth();
        const from = -(1.35 + i * 0.1) * W;
        viewer.switching = true;
        viewer.g.enabled = false;
        viewer.slotIndex = 2;
        viewer.trackOffset = -2 * W;
        viewer.track.style.transform = `translate3d(${from}px, 0, 0)`;
        viewer.trackAnim = { playState: 'running', cancel() {} };
        await sleep(16);
        wheel({ deltaX: 12, deltaY: 0 });
        await sleep(40);
        const got = visualX(viewer.track);
        drift17 = Math.max(drift17, Math.abs(got - (from - 12)));
        trace17.push(
          `#${i} from=${from.toFixed(0)} got=${got.toFixed(0)} swipeX=${viewer.g.swipeX.toFixed(
            0
          )} base=${String(viewer.g.wheelSwipe.base)} off=${viewer.trackOffset.toFixed(0)} W=${W}`
        );
        await settle(300);
      }
      ok(
        '17.14e 连续三次切图中起手，画面与手势始终对齐（误差 < 2px）',
        drift17 < 2,
        `最大误差 ${drift17.toFixed(2)}px｜${trace17.join('｜')}`
      );

      // 17.15 回弹被打断：必须接住回弹中途的那一截。
      //       没达标的那一段会回弹 200ms；回弹是 WAAPI 关键帧，优先级高于内联
      //       样式 —— 掐掉它的瞬间视觉会掉回内联值（= 0 偏移），那段没走完的
      //       位移就整段消失了。探针里 animate 是「立刻完成」的替身，所以这里
      //       手工把画面摆到回弹中途（真机上这就是「半滑回弹后又立刻再滑」）。
      await twOpen(2);
      const mid15 = -90; // 未达标的那一段推出去的位移
      viewer.track.style.transform = `translate3d(${viewer.trackOffset + mid15}px, 0, 0)`;
      let cancelled15 = false;
      viewer.g.anim = {
        cancel() {
          cancelled15 = true;
        }
      };
      const vis15before = visualX(viewer.track);
      await sleep(16);
      wheel({ deltaX: 30, deltaY: 0 }); // 回弹还没播完就再滑
      await sleep(16);
      ok('17.15a 打断回弹前先掐掉那个动画', cancelled15 === true, String(cancelled15));
      ok(
        '17.15b 从画面实际所在的位置接着跟手（不往回跳）',
        Math.abs(visualX(viewer.track) - (vis15before - 30)) < 2,
        `视觉 ${visualX(viewer.track).toFixed(1)}，期望 ${(vis15before - 30).toFixed(1)}`
      );
      ok(
        '17.15c 接管偏移 = 回弹中途的位置（不是写死的 0）',
        Math.abs(viewer.g.wheelSwipe.base - mid15) < 2,
        String(viewer.g.wheelSwipe.base)
      );
      ok('17.15d 打断回弹本身不会误翻页', viewer.index === 2, String(viewer.index));
      await settle(300);

      // 17.16 目标图第一帧就位：位置由三槽轨道 + 连续位移保证（17.1~17.15），
      //       这里只核对「换源那一帧槽里有没有像素」。旧 fill() 直接给底图设新
      //       src，会先抹掉旧像素再等 img:// 请求与解码 —— 起手 / 连续换槽的
      //       那一两帧就露成背景；越界槽更被显式清空，首尾阻尼直接拉出黑边。
      await twOpen(2);
      ok(
        '17.16a 左右邻槽开场后都带着图片地址（起手第一帧不是空槽）',
        Boolean(viewer.slots[0].__low.getAttribute('src')) &&
          Boolean(viewer.slots[2].__low.getAttribute('src')),
        `left=${viewer.slots[0].__low.getAttribute('src')} right=${viewer.slots[2].__low.getAttribute('src')}`
      );

      const edgeSlot = viewer.slots[0];
      edgeSlot.__index = -2; // 强制重填，模拟「滑到首张时轮转出来的越界槽」
      viewer.fill(edgeSlot, -1);
      ok(
        '17.16b 首张/末张的越界槽有当前图保底，不被清成背景占位',
        Boolean(edgeSlot.__low.getAttribute('src')),
        String(edgeSlot.__low.getAttribute('src'))
      );

      // 换源原子性：槽里已有像素时，fill 当帧旧节点必须还在 DOM、还带着旧地址。
      // 用一张立刻可解码的 1x1 data URL 当新图，避免探针里再引入网络等待。
      const paintedSlot = viewer.slots[2];
      const painted = paintedSlot.__low;
      const oldSrc = painted.getAttribute('src');
      Object.defineProperty(painted, 'naturalWidth', { configurable: true, value: 640 });
      painted.__want = oldSrc;
      viewer.swapSlotImage(
        paintedSlot,
        '__low',
        'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
        'slide-low'
      );
      ok(
        '17.16c 换源当帧旧像素仍在 DOM（没有「先清后取」的空白帧）',
        painted.parentNode === paintedSlot && painted.getAttribute('src') === oldSrc,
        `parent=${painted.parentNode === paintedSlot} src=${painted.getAttribute('src')}`
      );
      delete painted.naturalWidth;
      await settle(60);
      await viewer.close();

      /* ---------- 17.17 目标图贴边跟随：起手第一帧就进视口 ---------- *
       * `.slide img` 是 object-fit: contain 居中排的，槽里左右留白会先于图片
       * 进入视口（竖幅照片能到三四百 px）。旧行为：轨道已经动了十几像素，
       * 目标图却还在视口外 —— 槽里不是没有像素，是**图片没贴着边缘**。
       * 这里量「目标图片近边 vs 目标槽近边」，两者之差就是要先露出的留白。 */
      const { thumbUrl: probeThumb } = await import('./js/api.js');
      await twOpen(2);
      const seamFrames = [];
      for (const dd of [12, 18, 24, 30, 36, 42]) {
        await sleep(18);
        wheel({ deltaX: -dd, deltaY: 0 });
        const sx = viewer.g.swipeX;
        const dir = sx < 0 ? 1 : -1;
        const ts = viewer.slots[1 + dir];
        const sr = ts.getBoundingClientRect();
        const ir = ts.__low.getBoundingClientRect();
        seamFrames.push({
          sx,
          dir,
          gap: dir < 0 ? sr.right - ir.right : ir.left - sr.left,
          near: dir < 0 ? ir.right : ir.left,
          slideNear: dir < 0 ? sr.right : sr.left,
          index: ts.__index,
          src: ts.__low.getAttribute('src'),
          currentSrc: viewer.currentSlot.__low.getAttribute('src')
        });
      }
      ok(
        '17.17a 起手第一帧目标图就贴着对应侧边缘（可见宽度≈跟手位移，不先露留白）',
        seamFrames[0].sx > 0 && seamFrames[0].gap >= -2 && seamFrames[0].gap <= 3,
        `gap=${seamFrames[0].gap.toFixed(1)} swipeX=${seamFrames[0].sx.toFixed(1)}`
      );
      ok(
        '17.17b 目标图的进入位置/可见区域随 wheel 进度连续同步（单调、无跳变）',
        seamFrames.every((f, i) => i === 0 ||
          (f.near > seamFrames[i - 1].near + 1 &&
            f.gap >= seamFrames[i - 1].gap - 1 &&
            Math.abs((f.slideNear - f.near) - (seamFrames[i - 1].slideNear - seamFrames[i - 1].near)) < 25)) &&
          seamFrames[5].near - seamFrames[0].near > 100,
        seamFrames.map((f) => `${f.near.toFixed(0)}/${f.gap.toFixed(0)}`).join(' → ')
      );
      ok(
        '17.17c 两张图同时在场：目标槽装目标那张，当前槽装当前那张',
        seamFrames.every((f) => f.index === 1 &&
          f.src === probeThumb(items[1].id) &&
          f.currentSrc === probeThumb(items[2].id)),
        seamFrames[0].src + ' | ' + seamFrames[0].currentSrc
      );
      await settle(300);
      ok(
        '17.17d 流结束后贴边量全部归零（收尾态与键盘/按钮切图一致）',
        viewer.slots.every((s) => s.__seam === 0 &&
          !s.__low.style.transform && !s.__full.style.transform),
        viewer.slots.map((s) => `${s.__seam}/${s.__low.style.transform}`).join(' | ')
      );
      await viewer.close();

      // 取消（慢拖未达阈值 → 回弹）也必须把贴边量收回去
      await twOpen(2);
      for (const dd of [12, 18, 24, 20, 16]) {
        await sleep(18);
        wheel({ deltaX: -dd, deltaY: 0 });
      }
      await settle(300);
      ok(
        '17.17e 取消回弹后同样归零，不留悬空的贴边偏移',
        viewer.slots.every((s) => s.__seam === 0 &&
          !s.__low.style.transform && !s.__full.style.transform),
        viewer.slots.map((s) => `${s.__seam}/${s.__low.style.transform}`).join(' | ')
      );
      await viewer.close();

      // 一段流里中途掉头：贴边量要立刻换到另一侧，旧侧归零。
      // 断言不能假设「一定存在居中留白」：窄屏 414px 下 16:9 的图按宽度铺满，
      // seamMargin === 0，本来就没有留白可挪，贴边量正确值就是 0。这里改成
      // 钉「公式 + 换边 + 旧侧归零 + 近边留白被消掉」，与视口尺寸无关；
      // 桌面（有留白）仍额外要求贴边量真的非零。
      await twOpen(2);
      for (const dd of [-12, -18, 30, 40, 50]) {
        await sleep(16);
        wheel({ deltaX: dd, deltaY: 0 });
      }
      const turnedSx = viewer.g.swipeX;
      const turnedDir = turnedSx < 0 ? 1 : -1;
      const turnedTarget = viewer.slots[1 + turnedDir];
      const turnedOld = viewer.slots[1 - turnedDir];
      const flowW = viewer.g.wheelSwipe.viewW || viewer.slotWidth();
      const turnedMargin = viewer.seamMargin(turnedTarget, flowW);
      const turnedProgress = Math.min(1, Math.abs(turnedSx) / Math.max(1, flowW));
      const expectedSeam = -turnedDir * turnedMargin * (1 - turnedProgress);
      const turnedWanted = viewer.index + turnedDir;
      const turnedAt = turnedWanted >= 0 && turnedWanted < items.length ? turnedWanted : -1;
      const tSlotRect = turnedTarget.getBoundingClientRect();
      const tImgRect = turnedTarget.__low.getBoundingClientRect();
      const turnedGap = turnedDir < 0
        ? tSlotRect.right - tImgRect.right
        : tImgRect.left - tSlotRect.left;
      ok(
        '17.17f 中途反向时贴边量跟着换边，旧目标槽不再带偏移',
        Math.abs(turnedSx) > 0 &&
          Math.abs((turnedTarget.__seam ?? 0) - expectedSeam) < 1 &&
          (turnedOld.__seam ?? 0) === 0 &&
          turnedTarget.__index === turnedAt &&
          Math.abs(turnedGap - turnedMargin * turnedProgress) < 3 &&
          (turnedMargin === 0 || Math.abs(turnedTarget.__seam ?? 0) > 0),
        `swipeX=${turnedSx.toFixed(1)} margin=${turnedMargin.toFixed(1)} ` +
          `expect=${expectedSeam.toFixed(1)} gap=${turnedGap.toFixed(1)} ` +
          `left=${viewer.slots[0].__seam} right=${viewer.slots[2].__seam} ` +
          `target=${turnedTarget.__index}/${turnedAt}`
      );
      await settle(300);
      await viewer.close();

      /* ---------- 17.18 落位速度连续：无硬停顿、无慢速居中 ---------- *
       * 旧的固定 180ms + EASE(.22,1,.36,1)：前 13% 时间走完近半程、末 1/3
       * 时间只挪约 1% —— 目标图在接近居中处先「硬停」，再以近零速度爬完最后
       * 几 px。这里把**真正传给 animate()** 的时长 / 缓动取出来，解析贝塞尔
       * 逐点量速度；静态检查只看得到源码里有没有那个公式。
       ---------------------------------------------------------------- */
      const bez3 = (t, p1, p2) =>
        3 * (1 - t) ** 2 * t * p1 + 3 * (1 - t) * t * t * p2 + t ** 3;
      const bezProgress = (u, x1, y1, x2, y2) => {
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 44; i += 1) {
          const m = (lo + hi) / 2;
          if (bez3(m, x1, x2) < u) lo = m;
          else hi = m;
        }
        return bez3((lo + hi) / 2, y1, y2);
      };
      const landParams = (anim) => {
        const px = (v) => parseFloat(/translate3d\(\s*(-?[\d.]+)px/.exec(String(v))[1]);
        const m = /cubic-bezier\(([-\d.]+),\s*([-\d.]+),\s*([-\d.]+),\s*([-\d.]+)\)/.exec(
          anim?.options?.easing || ''
        );
        if (!m || !Array.isArray(anim?.keyframes?.transform)) return null;
        const e = m.slice(1).map(Number);
        const dist = Math.abs(px(anim.keyframes.transform[1]) - px(anim.keyframes.transform[0]));
        const duration = anim.options.duration;
        const vAt = (u) => {
          const h = 0.002;
          const a = Math.max(0, u - h);
          const b = Math.min(1, u + h);
          return ((bezProgress(b, ...e) - bezProgress(a, ...e)) / (b - a)) * dist / duration;
        };
        let lo = 0;
        let hi = 1;
        for (let i = 0; i < 44; i += 1) {
          const m2 = (lo + hi) / 2;
          if (bezProgress(m2, ...e) < 0.99) lo = m2;
          else hi = m2;
        }
        return {
          e,
          dist,
          duration,
          easing: anim.options.easing,
          vStart: vAt(0.001),
          v85: vAt(0.85),
          u99: (lo + hi) / 2
        };
      };

      // 记录 wheelLandTiming 的实参：补完时贴边归零与 go() 各调一次，必须同源
      const timingCalls = [];
      const realTiming = viewer.wheelLandTiming.bind(viewer);
      viewer.wheelLandTiming = (d, v) => {
        const out = realTiming(d, v);
        timingCalls.push({ d, v, ...out });
        return out;
      };
      // 贴边量的 CSS transition 在 rebalance() 里会被 clearSlotSeam 清掉，
      // 只能在 releaseWheelSeam 刚刚写完的那一刻抓
      let seamTransition = '';
      const realRelease = viewer.releaseWheelSeam.bind(viewer);
      viewer.releaseWheelSeam = (...args) => {
        // 必须把 timing 原样返回：onWheelSettle 的返回值要交给 reboundWheelSwipe，
        // 否则探针里轨道动画会退回旧曲线、与贴边量不同源。
        const timing = realRelease(...args);
        const img = viewer.slots
          .map((s) => s.__low)
          .find((n) => /^transform [\d.]+ms cubic-bezier\(/.test(n?.style?.transition || ''));
        seamTransition = img?.style.transition || '';
        return timing;
      };

      // 长甩：显示位移被压到接近一屏，落位只剩几十 px 的余数
      await twOpen(1);
      clearAnimations();
      timingCalls.length = 0;
      seamTransition = '';
      const longStep18 = Math.max(20, Math.ceil(viewer.slotWidth() / 12));
      for (let i = 0; i < 40; i += 1) {
        await sleep(16);
        wheel({ deltaX: longStep18, deltaY: 0 });
      }
      for (const d of [22, 19, 16, 13, 10, 8, 6, 4, 3, 2]) {
        await sleep(16);
        wheel({ deltaX: d, deltaY: 0 });
      }
      await settle(300);
      const longLand = landParams(lastOf(viewer.track));
      const longTiming = timingCalls.slice();

      // 轻甩：只推进约 285px，落位还要补大半屏
      await twOpen(1);
      clearAnimations();
      timingCalls.length = 0;
      seamTransition = '';
      await swipeOnce(-1);
      await settle(300);
      const shortLand = landParams(lastOf(viewer.track));
      const shortTiming = timingCalls.slice();
      const shortSeam = seamTransition;

      ok(
        '17.18a 落位时长随剩余距离收缩：接近居中的长甩明显短于 180ms，轻甩仍在上限内',
        longLand && shortLand &&
          longLand.duration >= 24 && longLand.duration < 180 &&
          shortLand.duration >= 24 && shortLand.duration <= 180 &&
          longLand.duration < shortLand.duration,
        `long=${longLand?.duration}/${longLand?.dist?.toFixed(1)}px ` +
          `short=${shortLand?.duration}/${shortLand?.dist?.toFixed(1)}px`
      );

      ok(
        '17.18b 缓动起点速度 = 交接的跟手速度、终点速度 = 0（y2=1 且 y1≤1 不过冲）',
        longLand && shortLand &&
          longLand.e[3] === 1 && shortLand.e[3] === 1 &&
          longLand.e[1] >= 0 && longLand.e[1] <= 1 &&
          shortLand.e[1] >= 0 && shortLand.e[1] <= 1 &&
          longTiming.length === 2 && shortTiming.length === 2 &&
          Math.abs(longLand.vStart - longTiming[1].velocity) < 0.08 &&
          Math.abs(shortLand.vStart - shortTiming[1].velocity) < 0.08,
        `long v0=${longTiming[1]?.velocity} vStart=${longLand?.vStart?.toFixed(3)} ` +
          `short v0=${shortTiming[1]?.velocity} vStart=${shortLand?.vStart?.toFixed(3)}`
      );

      ok(
        '17.18c 接近居中不再硬停：85% 时刻仍有速度，最后 1% 行程不占掉大半段落位时间',
        longLand && shortLand &&
          longLand.v85 / longLand.vStart >= 0.1 &&
          shortLand.v85 / shortLand.vStart >= 0.1 &&
          longLand.u99 >= 0.8 && shortLand.u99 >= 0.8,
        `long v85/v0=${(longLand?.v85 / longLand?.vStart)?.toFixed(3)} u99=${longLand?.u99?.toFixed(3)} ` +
          `short v85/v0=${(shortLand?.v85 / shortLand?.vStart)?.toFixed(3)} u99=${shortLand?.u99?.toFixed(3)} ` +
          `（旧 EASE 分别 ≈0.003 / 0.65）`
      );

      // 窄屏图片按宽度铺满时 m=0，没有可归零的贴边量 —— 那时 releaseWheelSeam
      // 本来就不写 transition，契约退化为「两次 wheelLandTiming 参数同源」。
      ok(
        '17.18d 贴边归零与轨道落位共用同一份时长 / 缓动（无留白视口没有可归零的贴边量）',
        shortTiming[0].duration === shortTiming[1].duration &&
          shortTiming[0].easing === shortTiming[1].easing &&
          (shortSeam === '' ||
            (shortSeam.includes(`transform ${shortLand?.duration}ms`) &&
              shortSeam.includes(shortLand?.easing))),
        `seam="${shortSeam}" land="${shortLand?.duration}ms ${shortLand?.easing}"`
      );

      // 双向：镜像手势走另一个方向，落位节奏与形状一致
      await twOpen(3);
      clearAnimations();
      timingCalls.length = 0;
      await swipeOnce(1);
      await settle(300);
      const backLand = landParams(lastOf(viewer.track));
      const backTiming = timingCalls.slice();
      ok(
        '17.18e 反方向切换同样连续：起点速度 = v0、终点 = 0、85% 时刻不硬停',
        backLand && backLand.e[3] === 1 && viewer.index === 4 &&
          Math.abs(backLand.vStart - backTiming[backTiming.length - 1]?.velocity) < 0.08 &&
          backLand.v85 / backLand.vStart >= 0.1 && backLand.u99 >= 0.8,
        `index=${viewer.index} vStart=${backLand?.vStart?.toFixed(3)} ` +
          `v85/v0=${(backLand?.v85 / backLand?.vStart)?.toFixed(3)} u99=${backLand?.u99?.toFixed(3)}`
      );

      // 连续快滑：每段各自算一份参数，不复用上一段的残留
      await twOpen(2);
      clearAnimations();
      timingCalls.length = 0;
      await swipeOnce(-1);
      await settle(300);
      await swipeOnce(-1);
      await settle(300);
      const twoLands = animations
        .filter((a) => a.el === viewer.track && a.keyframes?.transform)
        .map(landParams);
      ok(
        '17.18f 连续快滑每段各自算落位时长 / 缓动，同一段内贴边与轨道参数一致',
        twoLands.length === 2 && twoLands.every((p) =>
          p && p.duration >= 24 && p.duration <= 180 && p.e[3] === 1 &&
          p.v85 / p.vStart >= 0.1) &&
          timingCalls.length === 4 &&
          timingCalls[0].duration === timingCalls[1].duration &&
          timingCalls[0].easing === timingCalls[1].easing &&
          timingCalls[2].duration === timingCalls[3].duration &&
          timingCalls[2].easing === timingCalls[3].easing,
        `lands=${twoLands.map((p) => p?.duration).join('/')} calls=${timingCalls.length}`
      );

      viewer.wheelLandTiming = realTiming;
      viewer.releaseWheelSeam = realRelease;

      /* ---------- 18. 有来源 / 无来源必须是同一份开场 ---------- *
       * 「图片墙点击」和「打开方式」以前各给 open() 配一套 options（一个有
       * fadeIn、一个没有；一个带中心兜底、一个不带），于是同一个全屏预览悄悄
       * 长成两种样子。现在两条路都汇到 `openFullscreen()`，区别只剩「来源矩形
       * 有没有送到」—— 跨窗口传丢了就退化成中心放大，而不是变成另一种观感。
       * 这里比对的是**真正传给 animate() 的实参**：静态检查只能看到源码里有
       * 没有这个方法，看不到调用时传了什么。
       *
       * 虚拟时间下每渲染帧要吃掉一笔不小的预算（见 probe_gallery.mjs 说明），
       * 所以这里只做两次「开—关」，不能像功能测试那样随便铺。 */

      await viewer.close();
      await sleep(30);
      // CENTER_ZOOM_SCALE 在 14 节已经 import 过（同一作用域）

      /** 一次开场在关键帧 / 时长 / 缓动上留下的全部可比对信息 */
      const openingOf = () => {
        // 位移与透明度是两条并行动画，各取各的那一条
        const slide = lastWith(viewer.slots[1], 'transform');
        const fade = lastWith(viewer.slots[1], 'opacity');
        const bg = lastOf(viewer.backdrop);
        return {
          from: slide?.keyframes?.transform?.[0] ?? '',
          to: slide?.keyframes?.transform?.[1] ?? '',
          fade: fade?.keyframes?.opacity?.[0] ?? null,
          fadeDuration: fade?.options?.duration ?? null,
          duration: slide?.options?.duration ?? null,
          easing: slide?.options?.easing ?? null,
          bgDuration: bg?.options?.duration ?? null
        };
      };

      // 18.1 有来源：那一格经主窗口折成屏幕坐标、再折回这里的视口
      clearAnimations();
      viewer.openLaunch(2, { left: 60, top: 40, width: 120, height: 96 });
      const viaRect = openingOf();
      ok(
        '18.1a 有来源时开场从那一格放大（起点不是 identity）',
        /scale\([\d.]+\)/.test(viaRect.from) && viaRect.to.includes('scale(1)'),
        viaRect.from
      );
      ok(
        '18.1b 有来源时也带透明度渐变（与无来源那条一致）',
        viaRect.fade === 0,
        String(viaRect.fade)
      );
      ok(
        '18.1c 时长 / 缓动与关闭切换共用同一份常量',
        viaRect.duration === OPEN_MS && viaRect.easing === OPEN_EASE,
        `${viaRect.duration} / ${viaRect.easing}`
      );
      ok('18.1d 遮罩背景同时淡入', viaRect.bgDuration > 0, String(viaRect.bgDuration));
      ok(
        '18.1e 两条路共用同一个切换实现（go / 手势都是 viewer 自己的）',
        typeof viewer.go === 'function' &&
          typeof viewer.openFullscreen === 'function' &&
          typeof viewer.openLaunch === 'function'
      );
      await viewer.close();
      await sleep(30);

      // 18.2 来源没送到（跨窗口那趟折算出问题 / 冷启动没有光标位置）：
      // 退化为屏幕中心放大，而不是「直接出现」，更不是变成另一种观感
      clearAnimations();
      viewer.openFullscreen(2, null);
      const viaNothing = openingOf();
      ok(
        '18.2a 无来源时按中心倍率兜底',
        viaNothing.from.includes(`scale(${CENTER_ZOOM_SCALE})`),
        viaNothing.from
      );
      ok(
        '18.2b 兜底的时长 / 缓动 / 渐变 / 背景与有来源那条逐项相同',
        viaNothing.duration === viaRect.duration &&
          viaNothing.easing === viaRect.easing &&
          viaNothing.fade === viaRect.fade &&
          viaNothing.bgDuration === viaRect.bgDuration,
        `${viaNothing.duration}/${viaNothing.easing}/fade=${viaNothing.fade}/bg=${viaNothing.bgDuration}`
      );
      await viewer.close();
      await sleep(30);

      /* ---------------------------------------------------------------- *
         19. 关闭时序：通知收窗口之前，画面必须已经淡完
         ---------------------------------------------------------------- *

         预览现在是独立窗口，收摊那一下后端会把它**整个销毁**（不动几何）。
         所以要守的顺序变成了：画面先淡完 → 幕布退去 → 最后才通知。
         顺序反了，用户看见的是画面「啪」地消失；通知多一次，主窗口就被叫醒
         一次（那正是「退出预览后窗口被顶到最大化」的反面）。

         静态检查只能看到「有没有这个出口」，看不到它排在动画前面还是后面。
         这里跑一次真的关闭，在收摊**之前**那一刻把状态拍下来。
      ------------------------------------------------------------------ */

      const originPlayClose = viewer.playClose.bind(viewer);
      const at = { opacity: null, hidden: null, backdrop: null, count: -1 };
      let closeNotices = 0;
      viewer.onClosed = () => {
        closeNotices += 1;
      };
      viewer.playClose = async (options) => {
        await originPlayClose(options);
        // 此刻 finishClose() 还没跑：画面、幕布都还是它们在收摊前的样子
        at.opacity = viewer.slots[1].style.opacity;
        at.hidden = viewer.root.hidden;
        at.backdrop = viewer.backdropOpacity;
        at.count = animations.length;
      };

      clearAnimations();
      viewer.openLaunch(1, null);
      // 开场那批动画已播完，清掉；下面的记录只属于这一次关闭
      clearAnimations();
      await viewer.close();

      const slideAnims = animations.filter(
        (a) => a.el === viewer.slots[1] && a.keyframes?.transform
      );
      const rootFades = animations.filter(
        (a) => a.el === viewer.root && a.keyframes?.opacity
      );
      const rootFadeIndex = animations.indexOf(rootFades[0]);

      ok(
        '19.1 通知之前画面已经淡完（窗口隐去时下面是全黑，不是半张图）',
        at.opacity === '0',
        String(at.opacity)
      );
      ok(
        '19.2 那一刻幕布还盖着（预览仍是铺满的一整屏）',
        at.hidden === false && at.backdrop > 0,
        `hidden=${at.hidden} backdrop=${at.backdrop}`
      );
      // 记录到的是「收摊前已产生几条」，幕布那条必须排在它之前
      ok(
        '19.3 幕布退去排在收摊（也就是通知）之前',
        rootFades.length === 1 && rootFadeIndex >= 0 && rootFadeIndex < at.count,
        `root=${rootFades.length} idx=${rootFadeIndex} before=${at.count}`
      );
      ok(
        '19.4 退的是根容器而不是背景层（根容器自带不透明背景）',
        rootFades[0]?.el === viewer.root &&
          rootFades[0]?.keyframes?.opacity?.[1] === 0,
        JSON.stringify(rootFades[0]?.keyframes?.opacity)
      );
      ok(
        '19.5 幕布比画面退场短（此时已无事可做，拖长只是干等）',
        rootFades[0]?.options?.duration > 0 &&
          rootFades[0]?.options?.duration < slideAnims[0]?.options?.duration,
        `${rootFades[0]?.options?.duration} / ${slideAnims[0]?.options?.duration}`
      );
      ok('19.6 一次关闭只通知一次（叫两次会第二次点亮主窗口）', closeNotices === 1, String(closeNotices));
      viewer.playClose = originPlayClose;
      viewer.onClosed = () => {};

      /* ---------- 20. 减少动态效果 ---------- */

      const viewerSrc = await (await fetch('./js/viewer.js')).text();

      // 系统辅助功能开了「减少动态效果」之后，缩放位移应当让位给短淡入淡出。
      // 这里直接换掉 media query 的判定结果来验两条分支。
      ok(
        '20.1 转场时长与 FLIP 都挂在「减少动态效果」开关上',
        /const motionMs = \(ms\) => \(motionOK\(\) \? ms : REDUCED_MS\);/.test(
          viewerSrc
        ) && /const useFlip = motionOK\(\) && target/.test(viewerSrc)
      );
      ok(
        '20.2 关闭时的淡出用分段缓动（不是整段 linear 的硬拐点）',
        /opacity: \[1, 1, 0\], offset: \[0, 0\.55, 1\]/.test(viewerSrc) &&
          /easing: \['linear', 'ease-out'\]/.test(viewerSrc)
      );
      ok(
        '20.3 转场期间才挂 will-change，跑完撤掉（不留常驻合成层）',
        /el\.style\.willChange = 'transform, opacity';/.test(viewerSrc) &&
          /el\.style\.willChange = '';/.test(viewerSrc)
      );

      /* ---------- 21. 预览显示：每次操作都画着当前选中图片 ---------- */
      //
      // 前面所有断言跑在「img:// 加载失败」的无头环境里，量的是几何 / 索引 /
      // 状态机，量不到「这一格到底有没有图、是不是目标图」。这里把自定义协议
      // 换成真能加载的 SVG，再用一份干净的 Viewer 实例把「点击打开 → 切换 →
      // 连续切换 → 隔张跳转 → 关闭再打开 → 换图片集合」整条显示链路量一遍。
      // 这条回归专治：jumpTo() 的淡入把 inline opacity 留在 0，动画用
      // fill:'none' 播完又回到 0，当前槽永久全透明（后续 go() 只填轮转出去
      // 的那一格，透明会一直残留，于是切换 / 连续切换张张空白）。
      const srcDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
      const svgFor = (id) =>
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900">` +
          `<rect width="1600" height="900" fill="#334466"/>` +
          `<text x="40" y="80" font-size="40" fill="white">${id}</text></svg>`
        );
      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        configurable: true,
        get() { return srcDesc.get.call(this); },
        set(v) {
          this.__probeSrc = v;
          if (typeof v === 'string' && v.startsWith('img://localhost/')) {
            const m = v.match(/^img:\/\/localhost\/[^/]+\/([^?]+)/);
            srcDesc.set.call(this, svgFor(m ? m[1] : v));
          } else {
            srcDesc.set.call(this, v);
          }
        }
      });

      const { thumbUrl } = await import('./js/api.js');
      const displayRoot = document.getElementById('viewer').cloneNode(true);
      displayRoot.id = 'viewer-display-probe';
      displayRoot.hidden = true;
      displayRoot.querySelector('.viewer-stage').replaceChildren();
      displayRoot.querySelector('.strip-inner').replaceChildren();
      document.body.appendChild(displayRoot);
      const dv = new Viewer({ root: displayRoot, onError: () => {} });
      const displayItems = (prefix) => Array.from({ length: 6 }, (_, i) => ({
        id: `${prefix}-${i}`, name: `${prefix}-${i}.jpg`, width: 1600, height: 900
      }));
      dv.setItems(displayItems('show'));

      const tick21 = () => new Promise((r) => setTimeout(r, 30));
      const logical21 = (img) => img?.__want || img?.__probeSrc || '';
      const idOf21 = (img) => (logical21(img).match(/\/([^/?]+)(?:\?|$)/) || [, ''])[1];
      const check21 = async (label, expectIndex, prefix = 'show') => {
        await tick21();
        const slot = dv.currentSlot;
        const low = slot?.__low;
        const wanted = thumbUrl(dv.items[expectIndex].id);
        const state = {
          index: dv.index, want: wanted, actual: logical21(low),
          w: low?.naturalWidth, attached: low?.parentNode === slot,
          slotOpacity: getComputedStyle(slot).opacity,
          inlineOpacity: slot.style.opacity,
          counter: dv.counterEl?.textContent,
          allAttached: dv.slots.every((s) => s.__low?.parentNode === s)
        };
        ok(label,
          idOf21(low) === `${prefix}-${expectIndex}` &&
            logical21(low) === wanted &&
            low?.naturalWidth > 0 && low?.parentNode === slot &&
            getComputedStyle(slot).opacity === '1' && !slot.style.opacity &&
            dv.counterEl?.textContent === `${expectIndex + 1} / 6` &&
            state.allAttached,
          JSON.stringify(state));
      };

      dv.openLaunch(2, null);
      await check21('21.1 点击打开预览：当前槽画着选中图且有像素', 2);

      await dv.go(1);
      await check21('21.2 切到下一张：目标图正常显示', 3);

      await dv.go(1);
      await dv.go(1);
      await check21('21.3 连续切换：每一步都是当前图', 5);

      await dv.go(1);
      await check21('21.4 末张边界不换页，画面不空白', 5);

      await dv.jumpTo(0);
      await check21('21.5 胶片条隔张跳转：淡入终值已提交（不再停在 opacity:0）', 0);

      await dv.jumpTo(2);
      await dv.go(1);
      await dv.go(1);
      await dv.go(-1);
      await check21('21.6 跳转之后连续切换：残留透明不带到后续换页', 3);

      const staleSlot = dv.currentSlot;
      const staleSrc = logical21(staleSlot.__low);
      staleSlot.style.opacity = '0';
      dv.fill(staleSlot, dv.index); // 内容没变 → 提前返回
      await tick21();
      ok('21.7 fill 提前返回也清掉残留透明，且不抹掉已有像素',
        !staleSlot.style.opacity && getComputedStyle(staleSlot).opacity === '1' &&
          logical21(staleSlot.__low) === staleSrc,
        `inline=${staleSlot.style.opacity} src=${logical21(staleSlot.__low)}`);

      await dv.close();
      dv.openLaunch(4, null);
      await check21('21.8 关闭后再从画廊打开另一张：正常显示', 4);

      dv.setItems(displayItems('new'));
      await dv.jumpTo(4); // 同一索引、另一份图片集合
      await check21('21.9 换图片集合同一索引：画面跟着换成新集合', 4, 'new');

      Object.defineProperty(HTMLImageElement.prototype, 'src', srcDesc);

      } catch (error) {
        log.push(`THREW ${error && error.stack ? error.stack.split('\n')[0] : String(error)}`);
      }
      out.textContent = log.join('\n');
      document.title = log.some((l) => l.startsWith('FAIL') || l.startsWith('THREW'))
        ? 'HAS-FAIL'
        : 'ALL-PASS';
    </script>
  </body>
</html>
