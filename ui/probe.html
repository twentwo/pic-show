<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>probe</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <pre id="out">running</pre>
    <script type="module">
      const out = document.getElementById('out');
      const log = [];
      // 每断言一次就写回 DOM：万一后面卡住，也能看出卡在哪一步
      const ok = (name, cond, extra = '') => {
        log.push(`${cond ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`);
        out.textContent = log.join('\n');
      };

      // 用真实的 index.html 结构，避免探针与线上 DOM 分叉
      const html = await (await fetch('./index.html')).text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      for (const node of [...doc.body.children]) {
        if (node.tagName === 'SCRIPT') continue;
        document.body.appendChild(node);
      }

      // 无头环境拿不到合成帧，Web Animations 永不 finished。
      // 换成「立刻完成」的替身：动画的终值本来就是代码预写进 inline style 的，
      // 所以状态与布局依然真实，只是省掉了 300ms 的过程。
      // 顺带把**每次调用的参数**记下来 —— 15 节要靠它核对启动动画的起点、
      // 时长与缓动（这些是 CSS 之外的部分，不看调用就断言不到）。
      const animations = [];
      Element.prototype.animate = function (keyframes, options) {
        animations.push({ el: this, keyframes, options });
        return { finished: Promise.resolve(), cancel() {}, finish() {} };
      };
      const clearAnimations = () => (animations.length = 0);
      const lastOf = (el) => {
        for (let i = animations.length - 1; i >= 0; i -= 1) {
          if (animations[i].el === el) return animations[i];
        }
        return null;
      };

      try {
      const { Grid } = await import('./js/grid.js');
      const { Viewer, IDLE_MS, FADE_MS, FADE_EASE, OPEN_MS, OPEN_EASE } =
        await import('./js/viewer.js');
      const { applyTheme } = await import('./js/theme.js');
      const theme = await import('./js/theme.js');

      const items = Array.from({ length: 6 }, (_, i) => ({
        id: `fake-${i}`,
        name: `pic-${i}.jpg`,
        width: 1600 + i * 100,
        height: 900 + i * 40
      }));

      const grid = new Grid({
        root: document.getElementById('grid'),
        spacer: document.getElementById('grid-spacer'),
        onActivate: (i, cell) => viewer.open(i, cell)
      });
      const viewer = new Viewer({ root: document.getElementById('viewer'), grid });

      grid.setItems(items);
      viewer.setItems(items);

      const stage = viewer.stage;
      // viewer 还是 hidden 时 clientWidth = 0，必须先打开再量
      viewer.open(2, null);
      const stageW = stage.clientWidth;
      const centerOf = (el) => {
        const r = el.getBoundingClientRect();
        return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
      };
      const stageCenter = () => {
        const r = stage.getBoundingClientRect();
        return { x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) };
      };
      const near = (a, b, tol = 2) => Math.abs(a - b) <= tol;
      const indexes = () => viewer.slots.map((s) => s.__index);

      /* ---------- 1. 打开 ---------- */
      ok('打开后三个槽 = [1,2,3]', JSON.stringify(indexes()) === '[1,2,3]', indexes().join(','));
      ok('基准偏移 = -1 屏', viewer.trackOffset === -stageW, String(viewer.trackOffset));
      ok('计数器 = 3 / 6', viewer.counterEl.textContent === '3 / 6', viewer.counterEl.textContent);
      ok('胶片条渲染出窗口', viewer.strip.mounted.size >= 6, String(viewer.strip.mounted.size));

      const cur = viewer.currentSlot;
      const img = cur.__low;
      const c1 = centerOf(img);
      const sc = stageCenter();
      ok(
        '当前图居中于 stage',
        near(c1.x, sc.x) && near(c1.y, sc.y),
        `img(${c1.x},${c1.y}) stage(${sc.x},${sc.y})`
      );
      ok(
        '底图尺寸 = 适配尺寸',
        near(img.getBoundingClientRect().width, viewer.box.w, 1),
        `${img.getBoundingClientRect().width} vs ${viewer.box.w}`
      );
      ok(
        '当前项在胶片条里高亮',
        viewer.strip.mounted.get(2)?.classList.contains('is-current') === true
      );

      /* ---------- 2. 下一张（键盘路径） ---------- */
      await viewer.go(1);
      ok('切下一张后 index = 3', viewer.index === 3, String(viewer.index));
      ok('轮转后槽位回到 [2,3,4]', JSON.stringify(indexes()) === '[2,3,4]', indexes().join(','));
      ok('轮转后 slotIndex = 1', viewer.slotIndex === 1);
      ok('轮转后基准偏移 = -1 屏', viewer.trackOffset === -stageW, String(viewer.trackOffset));
      const c2 = centerOf(viewer.currentSlot.__low);
      ok('切换后画面仍居中', near(c2.x, sc.x) && near(c2.y, sc.y), `(${c2.x},${c2.y})`);
      ok('计数器 = 4 / 6', viewer.counterEl.textContent === '4 / 6', viewer.counterEl.textContent);

      /* ---------- 3. 上一张 ---------- */
      await viewer.go(-1);
      ok('切上一张后 index = 2', viewer.index === 2, String(viewer.index));
      ok('回退后槽位 = [1,2,3]', JSON.stringify(indexes()) === '[1,2,3]', indexes().join(','));
      const c3 = centerOf(viewer.currentSlot.__low);
      ok('回退后画面仍居中', near(c3.x, sc.x) && near(c3.y, sc.y), `(${c3.x},${c3.y})`);

      /* ---------- 4. 单指横滑 ---------- */
      const track = viewer.track;
      const pd = (type, x, y, id = 1) => {
        const ev = new PointerEvent(type, {
          pointerId: id,
          clientX: x,
          clientY: y,
          bubbles: true,
          cancelable: true,
          isPrimary: true
        });
        (type === 'pointerdown' ? track : window).dispatchEvent(ev);
      };
      const startX = Math.round(stageW / 2);
      const startY = Math.round(stage.clientHeight / 2);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      // 真实的触摸是「一串间隔十几毫秒的小位移」，而不是一帧跳到底
      const drag = async (id, stepPx, steps, stepMs) => {
        pd('pointerdown', startX, startY, id);
        let x = startX;
        for (let i = 0; i < steps; i += 1) {
          await sleep(stepMs);
          x += stepPx;
          pd('pointermove', x, startY, id);
        }
        pd('pointerup', x, startY, id);
        await sleep(400);
      };

      // 快划：每步 65px / 16ms → 速度约 4px/ms，远超阈值
      pd('pointerdown', startX, startY, 1);
      for (let i = 1; i <= 4; i += 1) {
        await sleep(16);
        pd('pointermove', startX - i * 65, startY, 1);
      }
      ok('横滑进入 swipe 模式', viewer.g.mode === 'swipe', String(viewer.g.mode));
      ok('横滑跟手位移', Math.abs(viewer.g.swipeX + 260) < 6, String(viewer.g.swipeX));
      pd('pointerup', startX - 260, startY, 1);
      await sleep(500);
      ok('松手后切到下一张', viewer.index === 3, String(viewer.index));
      ok('滑动后画面居中', near(centerOf(viewer.currentSlot.__low).x, sc.x));

      /* ---------- 5. 慢速小幅拖动应回弹 ---------- */
      await drag(2, -8, 3, 30);
      ok('小幅慢拖不切换', viewer.index === 3, String(viewer.index));
      ok('小幅慢拖后回弹归零', Math.abs(viewer.g.swipeX) < 0.01, String(viewer.g.swipeX));
      ok('回弹后画面仍居中', near(centerOf(viewer.currentSlot.__low).x, sc.x));

      /* ---------- 6. 胶片条跳转 ---------- */
      viewer.jumpTo(5);
      await new Promise((r) => setTimeout(r, 400));
      ok('跳转到第 6 张', viewer.index === 5, String(viewer.index));
      ok('跳转后槽位 = [4,5,-1]', JSON.stringify(indexes()) === '[4,5,-1]', indexes().join(','));
      ok('计数器 = 6 / 6', viewer.counterEl.textContent === '6 / 6', viewer.counterEl.textContent);

      /* ---------- 7. 到头时的回弹 ---------- */
      await viewer.go(1);
      ok('最后一张再下一张不动', viewer.index === 5, String(viewer.index));

      /* ---------- 7.5 响应式/布局 ---------- */
      const compact = window.innerWidth <= 720;
      ok(
        '胶片条尺寸随断点切换',
        viewer.strip.metrics.itemW === (compact ? 54 : 78),
        String(viewer.strip.metrics.itemW)
      );
      const stripH = compact ? 72 : 96;
      // 顶部还要让出标题栏那一条（图片不能被标题栏压住，显隐也不能引起跳动）
      const chromeTop = compact ? 50 : 54;
      ok(
        'stage 高度让出了胶片条与标题栏',
        Math.abs(stage.clientHeight - (window.innerHeight - stripH - chromeTop)) <= 1,
        `${stage.clientHeight} / ${window.innerHeight} - ${stripH} - ${chromeTop}`
      );
      ok(
        '胶片条自身高度正确',
        Math.abs(viewer.strip.root.clientHeight - stripH) <= 1,
        String(viewer.strip.root.clientHeight)
      );

      /* ---------- 7.6 滚轮缩放 ---------- */
      viewer.track.dispatchEvent(
        new WheelEvent('wheel', {
          deltaY: -200,
          clientX: startX,
          clientY: startY,
          bubbles: true,
          cancelable: true
        })
      );
      ok('滚轮放大生效', viewer.g.scale > 1.3, viewer.g.scale.toFixed(3));
      viewer.g.reset(false);
      ok('复位后 scale = 1', viewer.g.scale === 1);

      /* ---------- 7.7 下拉关闭 ---------- */
      pd('pointerdown', startX, startY, 3);
      await sleep(16);
      pd('pointermove', startX, startY + 60, 3);
      await sleep(16);
      pd('pointermove', startX, startY + 200, 3);
      ok('纵向拖动进入 dismiss', viewer.g.mode === 'dismiss', String(viewer.g.mode));
      ok('下拉产生进度', viewer.g.dismissProgress > 0.2, viewer.g.dismissProgress.toFixed(2));
      pd('pointerup', startX, startY + 200, 3);
      await sleep(500);
      ok('下拉松手后关闭', viewer.root.hidden === true);

      /* ---------- 7.8 点图片外关闭 ---------- */
      viewer.open(1, null);
      await sleep(400); // 展开动画期间手势是冻结的
      pd('pointerdown', 6, 6, 4);
      pd('pointerup', 6, 6, 4);
      await sleep(500);
      ok('点图片外关闭', viewer.root.hidden === true, String(viewer.root.hidden));

      /* ---------- 8. 窗口尺寸变化 ---------- */
      // 无头环境改不了真实窗口大小，但直接改容器尺寸会走完全相同的重排逻辑。
      //
      // 唯一绕不过去的是 ResizeObserver 的**投递**：它只在产生渲染帧时才回调，
      // 而 headless 在页面加载完之后就不出帧了（真实 Tauri 窗口每帧都在跑，
      // 不存在这个问题）。所以这里两步走：
      //   1. 断言三个组件确实都挂了 ResizeObserver（接线没断）；
      //   2. 把 rAF 临时换成同步执行，再手动调它们的 onResize()（与 RO 回调
      //      完全同一个入口），让「去重判断 → 合并到一帧 → 重排」确定性地跑完。
      const sleep2 = (ms) => new Promise((r) => setTimeout(r, ms));
      // 等「静止 → 自动隐藏」走完：IDLE_MS 触发 + 0.3s 淡出 + 余量
      const IDLE_WAIT = IDLE_MS + 500;
      const applyResize = async (fn) => {
        const realRaf = window.requestAnimationFrame;
        window.requestAnimationFrame = (cb) => {
          cb(performance.now());
          return 0;
        };
        try {
          fn();
        } finally {
          window.requestAnimationFrame = realRaf;
        }
        await sleep2(20);
      };
      const rectOf = (g, i) => {
        const el = g.mounted.get(i);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return {
          x: Math.round(r.left),
          y: Math.round(r.top),
          w: Math.round(r.width),
          h: Math.round(r.height),
          right: Math.round(r.right)
        };
      };
      /** 已挂载格子的实际几何是否与布局表一致（重排遗漏就直接暴露在这里） */
      const geomProblem = (g) => {
        const host = g.root.getBoundingClientRect();
        for (const [i, el] of g.mounted) {
          const found = g.cellOf(i);
          if (!found?.cell) return `index ${i} 无布局`;
          const r = el.getBoundingClientRect();
          if (Math.abs(r.width - found.cell.w) > 1) return `#${i} w ${Math.round(r.width)}≠${found.cell.w}`;
          if (Math.abs(r.height - found.cell.h) > 1) return `#${i} h ${Math.round(r.height)}≠${found.cell.h}`;
          if (Math.abs(r.left - (host.left + found.cell.x)) > 1) return `#${i} x 错位`;
          if (r.right > host.right + 1) return `#${i} 溢出右边界`;
        }
        for (let k = 1; k < g.rows.length; k += 1) {
          if (g.rows[k].y < g.rows[k - 1].y + g.rows[k - 1].h) return `第 ${k} 行与前一行重叠`;
        }
        return null;
      };

      /* ---- 8.1 多图网格：重排 + 滚动锚定 ---- */
      const host2 = document.createElement('main');
      host2.className = 'grid';
      host2.style.cssText =
        'position:fixed;left:0;top:0;width:900px;height:300px;visibility:hidden';
      const sp2 = document.createElement('div');
      sp2.className = 'grid-spacer';
      host2.appendChild(sp2);
      document.body.appendChild(host2);

      const grid2 = new Grid({ root: host2, spacer: sp2, onActivate: () => {} });
      grid2.setItems(
        Array.from({ length: 60 }, (_, i) => ({
          id: `g2-${i}`,
          name: `g2-${i}.jpg`,
          width: 1600,
          height: 900
        }))
      );
      const rowHBefore = grid2.rows[0].h;
      host2.scrollTop = 600;
      await sleep2(80);

      const anchor = grid2.topIndex(host2.scrollTop);
      const anchorBefore = rectOf(grid2, anchor);
      const nodeBefore = grid2.mounted.get(anchor);

      host2.style.width = '520px';
      await applyResize(() => grid2.onResize());

      ok('宽度变化触发重排', grid2._w === host2.clientWidth, `${grid2._w} vs ${host2.clientWidth}`);
      ok('行高随容器宽度重算', grid2.rows[0].h !== rowHBefore, `${rowHBefore} → ${grid2.rows[0].h}`);
      ok('已挂载格子几何已更新', geomProblem(grid2) === null, geomProblem(grid2) ?? '');
      ok('重排不重建 DOM 节点', grid2.mounted.get(anchor) === nodeBefore);
      const anchorAfter = rectOf(grid2, anchor);
      ok(
        '重排后锚点项仍在原位（滚动锚定）',
        anchorBefore && anchorAfter && Math.abs(anchorAfter.y - anchorBefore.y) <= 4,
        `${anchorBefore?.y} → ${anchorAfter?.y}`
      );

      // 宽度没变时不应重排（避免滚动条出现/消失引起的无谓抖动）
      const heightBefore = grid2.totalHeight;
      host2.style.height = '260px';
      await applyResize(() => grid2.onResize());
      ok('仅高度变化不重排行布局', grid2.totalHeight === heightBefore, `${heightBefore} vs ${grid2.totalHeight}`);

      // 尺寸为 0（最小化 / 隐藏）时必须跳过，不能把布局算坏
      host2.style.width = '0px';
      host2.style.height = '0px';
      await applyResize(() => grid2.onResize());
      ok('容器尺寸为 0 时跳过重排', grid2._w === 520 - 10 || grid2._w > 0, String(grid2._w));
      ok('零尺寸未破坏行布局', grid2.rows.length > 0 && grid2.rows[0].h > 0);
      host2.remove();

      /* ---- 8.2 预览区随容器重新适配 ---- */
      ok(
        '网格 / 预览 / 胶片条都挂了 ResizeObserver',
        grid2._ro instanceof ResizeObserver &&
          viewer._ro instanceof ResizeObserver &&
          viewer.strip._ro instanceof ResizeObserver
      );

      viewer.open(2, null);
      await sleep2(60);
      const vroot = viewer.root;
      const w1 = viewer.stage.clientWidth;
      const box1 = { w: viewer.box.w, h: viewer.box.h };

      vroot.style.width = '1100px';
      vroot.style.height = '700px';
      await applyResize(() => viewer.onResize());

      const w2 = viewer.stage.clientWidth;
      const item2 = viewer.currentItem;
      const imgRect = viewer.currentSlot.__low.getBoundingClientRect();

      ok('stage 宽度跟随容器', w2 !== w1 && w2 === 1100, `${w1} → ${w2}`);
      ok('适配尺寸已重算', viewer.box.w !== box1.w, `${box1.w} → ${viewer.box.w}`);
      ok(
        '图片实际尺寸 = 适配尺寸',
        near(imgRect.width, viewer.box.w, 1) && near(imgRect.height, viewer.box.h, 1),
        `${Math.round(imgRect.width)}×${Math.round(imgRect.height)} vs ${viewer.box.w}×${viewer.box.h}`
      );
      ok(
        '保持原始宽高比（不拉伸、不裁切）',
        Math.abs(imgRect.width / imgRect.height - item2.width / item2.height) < 0.01,
        (imgRect.width / imgRect.height).toFixed(3)
      );
      ok(
        '图片仍在 stage 内且居中',
        imgRect.width <= w2 + 1 &&
          imgRect.height <= viewer.stage.clientHeight + 1 &&
          near(centerOf(viewer.currentSlot.__low).x, stageCenter().x) &&
          near(centerOf(viewer.currentSlot.__low).y, stageCenter().y)
      );
      ok('轨道基准偏移 = -1 屏', viewer.trackOffset === -w2, String(viewer.trackOffset));

      /* ---- 8.3 改变尺寸保留缩放，只收敛平移 ---- */
      viewer.g.commit({ scale: 2, tx: 400, ty: 0 });
      const scaleBefore = viewer.g.scale;
      vroot.style.width = '820px';
      await applyResize(() => viewer.onResize());
      const maxX = (viewer.box.w * viewer.g.scale - viewer.stage.clientWidth) / 2;
      ok('改变尺寸保留缩放倍率', near(viewer.g.scale, scaleBefore, 0.001), viewer.g.scale.toFixed(3));
      ok(
        '平移被夹回新边界',
        viewer.g.tx <= Math.max(0, maxX) + 1,
        `tx=${viewer.g.tx.toFixed(1)} max=${Math.max(0, maxX).toFixed(1)}`
      );
      viewer.g.reset(false);

      /* ---- 8.4 胶片条重新居中当前项 ---- */
      viewer.strip.root.scrollLeft = 0;
      await sleep2(30);
      vroot.style.width = '380px';
      await applyResize(() => {
        viewer.onResize();
        viewer.strip.onResize();
      });
      const curItem = viewer.strip.mounted.get(viewer.strip.index);
      const cr = curItem?.getBoundingClientRect();
      const sr = viewer.strip.root.getBoundingClientRect();
      ok(
        '尺寸变化后胶片条重新居中当前项',
        cr && cr.left >= sr.left - 2 && cr.right <= sr.right + 2,
        `item(${Math.round(cr?.left)},${Math.round(cr?.right)}) strip(${Math.round(sr.left)},${Math.round(sr.right)})`
      );

      vroot.style.removeProperty('width');
      vroot.style.removeProperty('height');
      await applyResize(() => viewer.onResize());
      ok(
        '还原尺寸后布局再次正确',
        viewer.stage.clientWidth === stageW &&
          viewer.trackOffset === -stageW &&
          near(centerOf(viewer.currentSlot.__low).x, stageCenter().x)
      );
      await viewer.close();

      /* ---------- 9. 空闲自动隐藏 vs 指针事件 ---------- */
      viewer.open(1, null);
      await sleep2(60);
      const vr = viewer.root;
      // 窄屏只有 414 宽，坐标必须按 stage 现算，不能写死
      const midX = Math.round(viewer.stage.clientWidth / 2);
      const midY = Math.round(viewer.stage.clientHeight / 2);

      // 9.1 静止到点后进入 is-idle
      viewer.bumpControls();
      ok('刚唤醒时没有 is-idle', !vr.classList.contains('is-idle'));
      await sleep2(IDLE_WAIT);
      ok('静止到点后进入 is-idle', vr.classList.contains('is-idle'));

      /*
        9.1b 隐藏必须收掉 visibility，而不只是把 opacity 降到 0。

        胶片条窗口半径 40 → 最多 81 个节点常驻 DOM，其中待加载项的 shimmer
        动画是 `background-position` —— 这个属性**无法交给合成器**，每帧都要
        在主线程重新光栅化一遍。只把 opacity 降到 0 并不会中止它们，于是
        「界面看着已经空了，主线程还在满负荷刷渐变」，这就是空闲隐藏之后
        反而变卡的直接原因。

        这里不断言 getComputedStyle 的实时值：CSS transition 要靠渲染帧推进，
        无头环境不可靠（和 ResizeObserver 是同一个坑）。改为直接校验样式表
        规则本身 —— 防的是「有人把 visibility / pause 删掉」这种回归。
       */
      const cssText = await (await fetch('./styles/app.css')).text();
      const idleBlock = (cssText.match(
        /\.viewer\.is-idle\s+\.viewer-bar,[\s\S]*?\{([\s\S]*?)\}/
      ) ?? [])[1];
      ok(
        '空闲规则同时收掉 visibility（让胶片条退出合成）',
        /visibility:\s*hidden/.test(idleBlock ?? ''),
        (idleBlock ?? '').replace(/\s+/g, ' ').slice(0, 80)
      );
      ok(
        '空闲规则暂停 shimmer 动画（background-position 不合成）',
        /\.viewer\.is-idle\s+\.strip-item\.is-pending::after\s*\{[^}]*animation-play-state:\s*paused/.test(
          cssText
        )
      );
      ok(
        '恢复显示时 visibility 立刻生效（无延迟）',
        /\.viewer-bar,\s*\.nav-btn,\s*\.viewer-strip\s*\{[^}]*visibility\s+0s\s+linear\s+0s/.test(
          cssText
        )
      );

      // 9.2 关键回归：仅移动鼠标（不按下）就必须唤醒。
      //     空闲时光标是 cursor:none，若只有 pointerdown 能唤醒，用户移动鼠标
      //     时屏幕上什么都不会发生 —— 观感就是「鼠标动不了、界面卡死」。
      pd('pointermove', midX, midY, 7);
      ok('移动鼠标即唤醒控件', !vr.classList.contains('is-idle'));

      // 9.3 指针按着的时候绝不能进入 is-idle：
      //     给持有捕获的控件加 pointer-events:none 会打断指针序列，
      //     pointerup 可能永远收不到，手势状态就卡死了。
      viewer.bumpControls();
      pd('pointerdown', midX, midY, 8);
      ok('按下后手势进入 busy', viewer.g.busy === true);
      await sleep2(IDLE_WAIT);
      ok('指针按住时不进入 is-idle', !vr.classList.contains('is-idle'));
      ok('按住期间控件仍可交互', getComputedStyle(viewer.strip.root).visibility === 'visible');

      // 9.4 松手后计时器要能重新走起来（不能因为上面让过一次就永远不隐藏）
      pd('pointerup', midX, midY, 8);
      ok('松手后不再 busy', viewer.g.busy === false);
      await sleep2(IDLE_WAIT);
      ok('松手并静止后恢复自动隐藏', vr.classList.contains('is-idle'));

      // 9.5 指针状态兜底清理：失焦（切程序 / 最小化）不能留下残留 pointerId，
      //     否则之后每次 pointermove 都会被当成拖拽并 preventDefault
      viewer.bumpControls();
      pd('pointerdown', midX, midY, 9);
      ok('失焦前确有按下的指针', viewer.g.busy === true);
      window.dispatchEvent(new Event('blur'));
      ok('失焦后指针状态已清空', viewer.g.busy === false);
      ok('失焦后 dragging 已复位', viewer.g.dragging === false);

      // 残留清理后，移动鼠标不应再进入拖拽分支（swipeX 保持 0）
      const swipeBefore = viewer.g.swipeX;
      pd('pointermove', midX - 60, midY, 9);
      pd('pointermove', midX - 120, midY, 9);
      ok('失焦后移动不再被当作拖拽', viewer.g.swipeX === swipeBefore, String(viewer.g.swipeX));

      // 9.6 组件销毁时同样要清干净
      pd('pointerdown', midX, midY, 10);
      const gOld = viewer.g;
      gOld.detach();
      ok('detach 后指针状态清空', gOld.busy === false && gOld.dragging === false);

      await viewer.close();

      /* ---------- 10. 关闭 ---------- */
      viewer.open(1, null);
      await viewer.close();
      ok('关闭后隐藏', viewer.root.hidden === true);
      ok('关闭后槽位清空', indexes().every((i) => i < 0), indexes().join(','));

      /* ---------- 11. 从文件管理器打开（沉浸式预览） ---------- */

      // 11.1 关闭即退出：这个窗口是为看这一张而存在的
      let exitCalls = 0;
      viewer.onExit = () => { exitCalls += 1; };
      viewer.setExitOnClose(true);
      viewer.open(1, null);
      await viewer.close();
      ok('沉浸式关闭后退出应用', exitCalls === 1, String(exitCalls));
      viewer.setExitOnClose(false);
      viewer.open(1, null);
      await viewer.close();
      ok('非沉浸式关闭不退出', exitCalls === 1, String(exitCalls));

      // 11.2 目录里只有这一张图：不显示胶片条与左右按钮，计数器 1 / 1
      const single = [{ id: 'solo', name: 'only-one.jpg', width: 800, height: 600 }];
      viewer.setItems(single);
      viewer.open(0, null);
      ok('单图时隐去胶片条', viewer.root.classList.contains('no-strip'));
      ok(
        '单图时隐去左右按钮',
        getComputedStyle(viewer.nextBtn).display === 'none',
        getComputedStyle(viewer.nextBtn).display
      );
      ok('单图计数器 = 1 / 1', viewer.counterEl.textContent === '1 / 1', viewer.counterEl.textContent);
      ok('单图显示文件名', viewer.titleEl.textContent === 'only-one.jpg', viewer.titleEl.textContent);
      ok('单图时左右按钮均为禁用态', viewer.prevBtn.disabled && viewer.nextBtn.disabled);
      await viewer.go(1);
      ok('单图按「下一张」不越界', viewer.index === 0, String(viewer.index));
      await viewer.close();

      // 11.3 首 / 末张：默认禁用（并给回弹），不是循环
      viewer.setItems(items);
      viewer.open(0, null);
      ok(
        '首张时「上一张」禁用、「下一张」可用',
        viewer.prevBtn.disabled === true && viewer.nextBtn.disabled === false,
        `prev=${viewer.prevBtn.disabled} next=${viewer.nextBtn.disabled}`
      );
      await viewer.go(-1);
      ok('首张再按「上一张」不越界', viewer.index === 0, String(viewer.index));
      await viewer.jumpTo(items.length - 1);
      ok(
        '末张时「下一张」禁用、「上一张」可用',
        viewer.nextBtn.disabled === true && viewer.prevBtn.disabled === false,
        `prev=${viewer.prevBtn.disabled} next=${viewer.nextBtn.disabled}`
      );
      await viewer.go(1);
      ok('末张再按「下一张」不越界', viewer.index === items.length - 1, String(viewer.index));

      // 11.4 打开循环后首尾相接
      viewer.setLoop(true);
      ok('循环模式下末张「下一张」可用', viewer.nextBtn.disabled === false);
      await viewer.go(1);
      ok('循环：末张 → 首张', viewer.index === 0, String(viewer.index));
      await viewer.go(-1);
      ok('循环：首张 → 末张', viewer.index === items.length - 1, String(viewer.index));
      viewer.setLoop(false);
      await viewer.close();

      // 11.5 沉浸式样式：浏览器界面（顶栏 / 网格 / 空状态）一律不出现
      ok(
        '沉浸式规则隐藏顶栏与网格',
        /body\.is-immersive\s+\.topbar,[\s\S]*?\{[^}]*display:\s*none/.test(cssText)
      );
      ok(
        '沉浸式规则隐藏空状态',
        /body\.is-immersive\s+\.empty\s*\{[^}]*display:\s*none/.test(cssText)
      );
      ok(
        '沉浸式下查看器铺满整个窗口',
        /body\.is-immersive\s+\.viewer\s*\{[^}]*inset:\s*0/.test(cssText)
      );

      // 系统绘制的原生标题栏与预览面对不上色、也不受空闲计时控制，
      // 所以进入沉浸式前必须先让后端把它关掉（且要在窗口点亮之前）。
      const mainSrc = await (await fetch('./js/main.js')).text();
      ok(
        '进入沉浸式前关掉原生标题栏',
        /setImmersiveChrome\(true\)/.test(mainSrc) &&
          mainSrc.indexOf('setImmersiveChrome(true)') < mainSrc.indexOf('showWindow()')
      );

      /* ---------- 12. 标题栏与预览面的统一 ---------- */

      const barEl = document.getElementById('viewer-bar');
      const bgOf = (el) => getComputedStyle(el).backgroundColor;
      viewer.open(1, null);
      await sleep2(60);

      // 主题切换时背景色是有过渡的，读计算值会读到中间帧。
      // 这里要验的是「两者同源且同时变」，不是过渡本身 —— 先把过渡关掉。
      const killTransition = document.createElement('style');
      killTransition.textContent = '*, *::before, *::after { transition: none !important; }';
      document.head.appendChild(killTransition);

      // 从一个确定的状态出发：探针所在环境可能是浅色也可能是深色
      applyTheme('dark');
      await sleep2(30);
      const darkBar = bgOf(barEl);
      const darkBd = bgOf(viewer.backdrop);

      // 12.1 背景同源：色值一致，且不能有渐变 / 毛玻璃造成观感差异
      ok('标题栏背景色与预览背景一致', darkBar === darkBd, `${darkBar} vs ${darkBd}`);
      ok(
        '标题栏没有渐变（与纯色预览面无差异）',
        getComputedStyle(barEl).backgroundImage === 'none',
        getComputedStyle(barEl).backgroundImage
      );
      ok(
        '标题栏没有毛玻璃（backdrop-filter 会造成色差）',
        (getComputedStyle(barEl).backdropFilter || 'none') === 'none',
        String(getComputedStyle(barEl).backdropFilter)
      );

      // 12.2 深浅主题切换时两者一起变 —— 同一个变量，不可能只改掉一个
      applyTheme('light');
      await sleep2(30);
      const lightBar = bgOf(barEl);
      const lightBd = bgOf(viewer.backdrop);
      ok(
        '浅色主题下标题栏与预览背景仍一致',
        lightBar === lightBd && lightBar !== darkBar,
        `${lightBar} vs ${lightBd}`
      );
      ok('浅色主题确实改掉了预览背景', lightBd !== darkBd, `${darkBd} → ${lightBd}`);
      applyTheme('dark');
      await sleep2(30);
      ok(
        '切回深色后两者再次一致',
        bgOf(barEl) === bgOf(viewer.backdrop) && bgOf(barEl) === darkBar,
        `${bgOf(barEl)} vs ${bgOf(viewer.backdrop)}`
      );
      killTransition.remove();

      // 12.3 三者共用同一条规则 → 同一时长、同一缓动、同一开关
      const sharedRule =
        (cssText.match(/\.viewer-bar,\s*\.nav-btn,\s*\.viewer-strip\s*\{([\s\S]*?)\}/) ??
          [])[1] ?? '';
      const idleRule =
        (cssText.match(/\.viewer\.is-idle\s+\.viewer-bar,[\s\S]*?\{([\s\S]*?)\}/) ?? [])[1] ??
        '';
      ok(
        '标题栏/按钮/胶片条共用一条显示规则',
        /\.viewer-bar,\s*\.nav-btn,\s*\.viewer-strip\s*\{/.test(cssText) &&
          /opacity\s+var\(--chrome-fade\)\s+var\(--chrome-ease\)/.test(sharedRule),
        sharedRule.replace(/\s+/g, ' ').slice(0, 80)
      );
      ok(
        '三者共用同一条隐藏规则（不会提前/延后）',
        /\.viewer\.is-idle\s+\.viewer-bar,\s*\.viewer\.is-idle\s+\.nav-btn,\s*\.viewer\.is-idle\s+\.viewer-strip\s*\{/.test(
          cssText
        )
      );
      // 主题切换的那 0.15s：预览背景与标题栏必须同速，否则中间帧会露出色差
      ok(
        '预览背景与标题栏同速过渡',
        /\.viewer-backdrop\s*\{[^}]*transition:\s*background\s+0\.15s\s+ease/.test(cssText) &&
          /\.viewer-bar,\s*\.nav-btn,\s*\.viewer-strip\s*\{[^}]*background\s+0\.15s\s+ease/.test(
            cssText
          )
      );
      ok(
        '隐藏规则同样只用共用时长与缓动',
        /opacity\s+var\(--chrome-fade\)\s+var\(--chrome-ease\)/.test(idleRule) &&
          /visibility\s+0s\s+linear\s+var\(--chrome-fade\)/.test(idleRule),
        idleRule.replace(/\s+/g, ' ').slice(0, 80)
      );

      // 12.4 JS 阈值与 CSS 动画参数同源（chrome.js 写进 CSS 变量）
      const rootStyle = getComputedStyle(document.documentElement);
      ok(
        'CSS 淡入淡出时长 = JS 常量',
        rootStyle.getPropertyValue('--chrome-fade').trim() === `${FADE_MS}ms`,
        `${rootStyle.getPropertyValue('--chrome-fade')} vs ${FADE_MS}ms`
      );
      ok(
        'CSS 缓动 = JS 常量',
        rootStyle.getPropertyValue('--chrome-ease').trim() === FADE_EASE,
        `${rootStyle.getPropertyValue('--chrome-ease')} vs ${FADE_EASE}`
      );

      // 12.5 一起隐藏、一起出现；任意按键都能唤醒；隐藏不引起布局跳动
      viewer.bumpChrome();
      const rectBefore = viewer.stage.getBoundingClientRect();
      ok('刚唤醒时标题栏可见', !vr.classList.contains('is-idle'));
      await sleep2(IDLE_WAIT);
      ok('静止到点后三者一起隐藏', vr.classList.contains('is-idle'));
      const rectAfter = viewer.stage.getBoundingClientRect();
      ok(
        '隐藏控件不引起布局跳动（stage 几何不变）',
        near(rectBefore.top, rectAfter.top) && near(rectBefore.height, rectAfter.height),
        `${Math.round(rectBefore.top)}/${Math.round(rectBefore.height)} → ${Math.round(rectAfter.top)}/${Math.round(rectAfter.height)}`
      );
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'x', bubbles: true }));
      ok('任意按键都唤醒整套控件', !vr.classList.contains('is-idle'));

      // 12.6 标题栏不遮挡画面：stage 把标题栏那一条让了出来
      const barRect = barEl.getBoundingClientRect();
      const stageRect = viewer.stage.getBoundingClientRect();
      ok(
        'stage 让出标题栏高度（图片不会被压在标题栏下）',
        stageRect.top >= barRect.bottom - 1,
        `stage.top=${Math.round(stageRect.top)} bar.bottom=${Math.round(barRect.bottom)}`
      );
      await viewer.close();

      /* ---------- 13. 默认深色 / 手动切换 / 持久化 / 对比度 ---------- */

      // 先把「当前主题」这个小工具备好，下面几段都要用
      const currentThemeAttr = () => document.documentElement.dataset.theme;
      const prefersLight = window.matchMedia?.('(prefers-color-scheme: light)').matches;

      // 13.1 默认深色：没手动选过就一定是深色，**不看系统外观**
      localStorage.removeItem(theme.THEME_KEY);
      ok('未手动选择时读取不到偏好', theme.readPreference() === null);
      applyTheme('light'); // 先制造一个「现在不是深色」的现场
      ok(
        '未手动选择时一律解析为深色（系统偏好说了不算）',
        theme.resolveTheme() === 'dark' && theme.DEFAULT_THEME === 'dark',
        `resolve=${theme.resolveTheme()} 系统偏好=${prefersLight ? 'light' : 'dark'}`
      );
      theme.initTheme();
      ok(
        '默认装载后 DOM 上就是深色',
        document.documentElement.dataset.theme === 'dark',
        String(document.documentElement.dataset.theme)
      );

      // 13.2 手动切换 → 立刻生效 + 写进 localStorage
      theme.setTheme('light');
      ok('切到浅色后 DOM 立刻跟上', currentThemeAttr() === 'light');
      ok(
        '手动选择写进了 localStorage',
        localStorage.getItem(theme.THEME_KEY) === 'light',
        String(localStorage.getItem(theme.THEME_KEY))
      );
      ok('再读偏好已经是浅色', theme.readPreference() === 'light');

      // 13.3 持久化：模拟「下次打开」 —— 重新按存储解析一遍
      theme.initTheme();
      ok('重新装载仍是浅色（覆盖了默认深色）', currentThemeAttr() === 'light');
      theme.toggleTheme();
      ok('再翻一次回到深色', currentThemeAttr() === 'dark');
      ok(
        '翻转结果同样被记住',
        localStorage.getItem(theme.THEME_KEY) === 'dark',
        String(localStorage.getItem(theme.THEME_KEY))
      );

      // 非法值不能污染主题：认不出来就退回深色
      localStorage.setItem(theme.THEME_KEY, 'sepia');
      ok('非法存储值退回深色', theme.resolveTheme() === 'dark');
      localStorage.removeItem(theme.THEME_KEY);

      // 13.4 对比度：AA 正文 4.5:1、图形/描边 3:1。
      // 只看不透明令牌（半透明那几人组要合成之后才有意义，这里不假装算得准）。
      const noTransition2 = document.createElement('style');
      noTransition2.textContent = '*, *::before, *::after { transition: none !important; }';
      document.head.appendChild(noTransition2);

      const varOf = (name) =>
        getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const srgb = (c) => {
        const v = c / 255;
        return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      };
      // 半透明令牌先合成到它的承载面上再算：`rgba(0,0,0,.45)` 单独是算不出
      // 对比度的，而实际叠出来的那块深色（#101115 / #747678）完全可以。
      const over = (rgba, base) => {
        const nums = rgba.match(/[\d.]+/g).map(Number);
        const [r, g, b, a = 1] = nums;
        const toLin = Array.from(base.match(/\w\w/g), (h) => parseInt(h, 16) / 255);
        const mix = [1 - a, 1 - a, 1 - a].map(
          (k, i) => Math.round([r, g, b][i] * a + toLin[i] * 255 * k)
        );
        return `rgb(${mix.join(', ')})`;
      };

      const channel = (c) => (c > 1 ? srgb(c) : c);
      const lum = (color) => {
        const parts = color.startsWith('#')
          ? Array.from(color.slice(1).match(/\w\w/g), (h) => channel(parseInt(h, 16)))
          : color.match(/[\d.]+/g).slice(0, 3).map((n) => channel(Number(n)));
        const [r, g, b] = parts;
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const ratio = (a, b) => {
        const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
        return (hi + 0.05) / (lo + 0.05);
      };

      const basicPairs = [
        ['--text', '--bg', 4.5],
        ['--text', '--surface', 4.5],
        ['--text', '--surface-2', 4.5],
        ['--text-dim', '--bg', 4.5],
        ['--text-dim', '--surface-2', 4.5],
        ['--accent-ink', '--accent-solid', 4.5],
        ['--viewer-text', '--viewer-bg', 4.5],
        ['--viewer-dim', '--viewer-bg', 4.5],
        ['--accent', '--bg', 3]
      ];

      const contrastOf = (label) => {
        const bad = [];
        for (const [fg, bg, min] of basicPairs) {
          const r = ratio(varOf(fg), varOf(bg));
          if (!(r >= min)) bad.push(`${fg}/${bg}=${r.toFixed(2)}<${min}`);
        }
        // 失败缩略图上的「!」：--fail-ink 压在 fail-scrim 上，先合成再比
        const failBase = over(varOf('--fail-scrim'), varOf('--surface-2'));
        const failRatio = ratio(varOf('--fail-ink'), failBase);
        if (!(failRatio >= 4.5)) bad.push(`失败标记=${failRatio.toFixed(2)}<4.5`);
        ok(`${label}主题对比度全部达标`, bad.length === 0, bad.join(' '));
      };

      theme.setTheme('dark', { remember: false });
      contrastOf('深色');
      theme.setTheme('light', { remember: false });
      contrastOf('浅色');

      // 13.5 「没有一个组件被落下」：遍历 DOM，凡是自己有底色/描边/文字色的
      // 元素，深浅两套主题下必须表现出差异 —— 没差异说明它偷偷写死了颜色。
      const snapshot = () => {
        const map = new Map();
        const nodes = [document.body, ...document.querySelectorAll('body *')];
        for (const node of nodes) {
          const cs = getComputedStyle(node);
          map.set(node, {
            bg: cs.backgroundColor,
            fg: cs.color,
            border: cs.borderTopColor + '|' + cs.borderBottomColor
          });
        }
        return map;
      };
      const transparent = (v) => /rgba\(0, 0, 0, 0\)|transparent/.test(v);
      theme.setTheme('dark', { remember: false });
      const darkMap = snapshot();
      theme.setTheme('light', { remember: false });
      const lightMap = snapshot();

      const stale = [];
      for (const [node, d] of darkMap) {
        const l = lightMap.get(node);
        if (!l) continue;
        const dColorless =
          transparent(d.bg) && /rgb\(0, 0, 0\)|rgba\(0, 0, 0, 0\)/.test(d.border);
        if (dColorless) continue; // 只有继承来的文字色，不算「自己有颜色」
        // 有底色的组件必须跟着变；没底色的看文字色有没有跟上
        const changed = transparent(d.bg) ? d.fg !== l.fg : d.bg !== l.bg;
        if (!changed) {
          stale.push(
            `${node.tagName.toLowerCase()}${node.id ? '#' + node.id : '.' + (node.className || '').toString().split(' ')[0]}`
          );
        }
      }
      ok(
        '深浅主题下没有组件停留在旧配色',
        stale.length === 0,
        stale.slice(0, 6).join(', ')
      );

      noTransition2.remove();

      // 13.6 防闪：index.html 里那段同步脚本必须排在样式表**之前**，
      // 顺序错了，页面还是会闪一帧浅色。
      const htmlSrc = await (await fetch('./index.html')).text();
      const scriptAt = htmlSrc.indexOf('localStorage.getItem(');
      const linkAt = htmlSrc.indexOf('rel="stylesheet"');
      ok('防闪脚本排在样式表之前', scriptAt > 0 && scriptAt < linkAt, `${scriptAt} < ${linkAt}`);
      ok(
        '防闪脚本的兜底分支是深色',
        /var pref = 'dark'/.test(htmlSrc) && /root\.dataset\.theme = pref/.test(htmlSrc)
      );
      // （注释里提到它是在解释「为什么不接」，先把注释剥掉再判断）
      ok(
        '样式表里没有 prefers-color-scheme 兜底（否则默认值会被系统推翻）',
        !/@media\s*\(prefers-color-scheme/.test(
          cssText.replace(/\/\*[\s\S]*?\*\//g, '')
        )
      );

      // 13.7 两个入口都要能切换（沉浸式下顶栏是 display:none，够不着）
      const topbarBtn = document.getElementById('btn-theme');
      const viewerBtn = document.getElementById('btn-theme-viewer');
      ok('顶栏与预览标题栏各有一个主题开关', !!topbarBtn && !!viewerBtn);
      // 探针不跑 main.js，挂载这一步要自己做（真实入口由 main.js 调）
      theme.mountThemeToggles([topbarBtn, viewerBtn]);
      theme.setTheme('dark', { remember: false });
      topbarBtn.click();
      ok('点顶栏开关能切到浅色', currentThemeAttr() === 'light');
      viewerBtn.click();
      ok('点预览里的开关能切回深色', currentThemeAttr() === 'dark');
      ok(
        '两个开关的文案跟着当前主题走',
        viewerBtn.getAttribute('aria-label') === topbarBtn.getAttribute('aria-label') &&
          /浅色/.test(viewerBtn.getAttribute('aria-label')),
        String(viewerBtn.getAttribute('aria-label'))
      );
      localStorage.removeItem(theme.THEME_KEY);

      // ---- 14. 「右键 → 打开方式」的直达全屏启动 -------------------------
      const { launchOriginRect, launchWindowRect, CENTER_ZOOM_SCALE } =
        await import('./js/launch.js');
      const launchSrc = await (await fetch('./js/launch.js')).text();
      const bootSrc = await (await fetch('./js/main.js')).text();

      if (viewer.isOpen) await viewer.close();

      // 14.1 后端给的来源点（物理像素 / 桌面坐标系）→ 视口坐标系里的矩形
      const env = { dpr: 2, offsetX: 40, offsetY: 25, viewW: 800, viewH: 600 };
      const originRect = launchOriginRect({ x: 1000, y: 500, size: 96 }, env);
      // (1000/2 - 40, 500/2 - 25) = (460, 225)，再各减半格
      ok(
        '来源坐标按 dpr 与窗口位置换算到视口坐标系',
        originRect &&
          Math.abs(originRect.left - (460 - 48)) < 0.01 &&
          Math.abs(originRect.top - (225 - 48)) < 0.01,
        JSON.stringify(originRect)
      );
      ok(
        '来源矩形以光标为中心，边长取传入值',
        originRect.width === 96 && originRect.height === 96
      );

      // 14.2 拿不到来源时必须明确退回兜底，而不是返回一个歪掉的小矩形
      ok('没有来源点时返回 null', launchOriginRect(null, env) === null);
      ok(
        '坐标不是数字时返回 null',
        launchOriginRect({ x: NaN, y: 1, size: 96 }, env) === null
      );
      ok(
        '边长为 0 时返回 null',
        launchOriginRect({ x: 10, y: 10, size: 0 }, env) === null
      );
      ok(
        '起点飞出屏幕时返回 null（宁可退化成中心放大）',
        launchOriginRect({ x: 999999, y: 999999, size: 96 }, env) === null
      );
      ok('中心兜底倍率是 0.8', CENTER_ZOOM_SCALE === 0.8, String(CENTER_ZOOM_SCALE));

      const windowRect = launchWindowRect();
      ok(
        '目标窗口矩形是有限正数（给后端趁窗口还藏着摆尺寸）',
        [windowRect.x, windowRect.y, windowRect.width, windowRect.height].every(
          Number.isFinite
        ) &&
          windowRect.width > 1 &&
          windowRect.height > 1,
        JSON.stringify(windowRect)
      );

      // 14.3 启动分支：主界面根本不能出现在这一条路上
      ok('main.js 里有独立的启动分支', /async function bootLaunch/.test(bootSrc));
      ok(
        '启动分支走上之后直接 return，不会再显示主界面',
        /if \(pending\?\.items\?\.length\) \{\s*await bootLaunch[\s\S]*?return;/.test(
          bootSrc
        )
      );
      ok(
        '顺序是「先定窗口形态与尺寸 → 点亮 → 量布局 → 才播动画」',
        /prepareLaunchWindow\(launchWindowRect\(\)\)\s*\.catch\([\s\S]*?const target = launchWindowRect\(\);\s*await waitFor\([\s\S]*?viewer\.openLaunch\(/.test(
          bootSrc
        )
      );
      ok(
        '来源坐标那一问是并行发出去的，不排在点亮窗口之前（不拖慢首帧）',
        bootSrc.indexOf('const originPromise = api.launchOrigin()') <
          bootSrc.indexOf('await api\n    .prepareLaunchWindow('),
        `${bootSrc.indexOf('const originPromise = api.launchOrigin()')} / ${bootSrc.indexOf('await api\n    .prepareLaunchWindow(')}`
      );

      ok(
        '窗口原点取自可用区（screenX/screenY 在无边框最大化窗口上不可信）',
        /offsetX: Number\(screen\.availLeft\)/.test(launchSrc) &&
          !/offsetX: window\.screenX/.test(launchSrc)
      );
      ok(
        '动画前要等窗口长到目标尺寸（否则起点按旧尺寸算就偏了）',
        /const target = launchWindowRect\(\);\s*await waitFor\(\s*\(\) =>\s*Math\.abs\(document\.documentElement\.clientWidth - target\.width\) <= 2/.test(
          bootSrc
        )
      );

      // 14.4 起点优先级的 Levels：元素 > 矩形 > 中心
      viewer.open(2, null);
      const probeRect = { left: 60, top: 40, width: 120, height: 96 };
      const view = viewer.view();
      const expectScale = probeRect.width / viewer.box.w;
      const expectTx = probeRect.left + probeRect.width / 2 - view.w / 2;
      const expectTy = probeRect.top + probeRect.height / 2 - view.h / 2;
      const expectStart = `translate3d(${expectTx}px, ${expectTy}px, 0) scale(${expectScale})`;

      ok(
        '给了来源矩形就以它为 FLIP 起点',
        viewer.zoomStart(null, { fromRect: probeRect }) === expectStart,
        String(viewer.zoomStart(null, { fromRect: probeRect }))
      );
      ok(
        '没有来源信息时从中心 0.8 倍起步',
        viewer.zoomStart(null, { centerScale: CENTER_ZOOM_SCALE }) ===
          'translate3d(0px, 0px, 0) scale(0.8)'
      );
      ok(
        '缩略图元素优先于矩形参数（网格那条路不受影响）',
        viewer.zoomStart(probeRect, {
          fromRect: { left: 0, top: 0, width: 8, height: 8 }
        }) === expectStart
      );
      ok(
        '三者都没有就退回普通淡入',
        viewer.zoomStart(null, {}) === null
      );

      // 14.5 真实调用：无来源 → 中心 0.8 + 透明度渐变 + 沿用既有时长缓动
      await viewer.close();
      clearAnimations();
      viewer.openLaunch(2, null);
      const launched = lastOf(viewer.slots[1]);
      ok(
        '无来源时首帧是中心 0.8 倍',
        launched?.keyframes?.transform?.[0] === 'translate3d(0px, 0px, 0) scale(0.8)',
        String(launched?.keyframes?.transform?.[0])
      );
      ok(
        '终帧落到适配位置',
        launched?.keyframes?.transform?.[1] === 'translate3d(0px, 0px, 0) scale(1)'
      );
      ok(
        '开局带透明度渐变',
        Array.isArray(launched?.keyframes?.opacity) &&
          launched.keyframes.opacity[0] === 0 &&
          launched.keyframes.opacity[1] === 1,
        JSON.stringify(launched?.keyframes?.opacity)
      );
      ok(
        '时长与缓动与现有预览动画一致',
        launched?.options?.duration === OPEN_MS && launched?.options?.easing === OPEN_EASE,
        `${launched?.options?.duration} / ${launched?.options?.easing}`
      );

      // 14.6 有来源 → 起点就是那一格
      await viewer.close();
      clearAnimations();
      viewer.openLaunch(2, probeRect);
      const zoomed = lastOf(viewer.slots[1]);
      ok(
        '有来源矩形时首帧正是那一格的位置与大小',
        zoomed?.keyframes?.transform?.[0] === expectStart,
        String(zoomed?.keyframes?.transform?.[0])
      );

      // 14.7 动画不等图片：调用一回来就已经在工作了，图片还没到
      ok(
        'openLaunch 同步返回，不等图片解码',
        viewer.isOpen === true && viewer.slots[1].__low.complete === false,
        `isOpen=${viewer.isOpen} complete=${viewer.slots[1].__low.complete}`
      );
      await viewer.close();

      // ---- 15. 启动后的键盘焦点 -----------------------------------------
      // 「打开方式」启动的窗口是隐藏建起来的：webview 不是第一响应者，不显式
      // 抢焦点的话，用户得先点一下画面，方向键才肯工作。这一节核对的是
      // 「焦点什么时候落、落在哪儿」，顺序错了一样编译得过、跑得出。
      const rootEl = document.getElementById('viewer');
      ok(
        '预览视图本身可聚焦（tabindex="-1"：程序可聚焦、不进 Tab 遍历）',
        rootEl.getAttribute('tabindex') === '-1',
        String(rootEl.getAttribute('tabindex'))
      );

      // 15.1 焦点不在「打开」那一刻抢 —— 那时图片还没到、窗口还在 maximize
      document.body.focus();
      await viewer.close();
      viewer.openLaunch(2, null);
      const focusing = viewer.focusWhenReady(600);
      ok(
        '首图未落地时不抢焦点（早了会被后面几帧冲掉）',
        document.activeElement !== rootEl,
        String(document.activeElement?.id || document.activeElement?.tagName)
      );

      // 15.2 首图落地 → 焦点立刻落在预览视图上
      viewer.slots[1].__low.dispatchEvent(new Event('load'));
      await focusing;
      ok(
        '首图落地后焦点自动落在预览视图上',
        document.activeElement === rootEl,
        String(document.activeElement?.id || document.activeElement?.tagName)
      );

      // 15.3 原图先到也算「落地」（底图失败、原图成功时不能把焦点吊着）
      await viewer.close();
      viewer.openLaunch(3, null);
      const focusingFull = viewer.focusWhenReady(600);
      viewer.slots[1].__full.dispatchEvent(new Event('load'));
      await focusingFull;
      ok(
        '原图先到时同样立刻落焦点',
        document.activeElement === rootEl,
        String(document.activeElement?.id || document.activeElement?.tagName)
      );

      // 15.4 加载彻底失败也不能把焦点一直吊着：超时到了照样落
      await viewer.close();
      viewer.openLaunch(4, null);
      const t0 = Date.now();
      await viewer.focusWhenReady(30);
      const waited = Date.now() - t0;
      ok(
        '图片迟迟不来时靠超时兜底（不会把焦点永远吊住）',
        document.activeElement === rootEl && waited < 400,
        `waited=${waited}ms active=${document.activeElement?.id}`
      );

      // 15.5 焦点落在预览上之后，方向键必须直接切图（无需先点一下）
      await viewer.close();
      viewer.openLaunch(2, null);
      viewer.slots[1].__low.dispatchEvent(new Event('load'));
      await viewer.focusWhenReady(600);
      const before = viewer.index;
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      ok(
        '焦点在预览上时方向键直接切下一张',
        viewer.index === before + 1,
        `${before} -> ${viewer.index}`
      );
      await viewer.close();

      // ---- 16. 双指状态机与单指状态的交界 -------------------------------
      // 这里没有「双指横滑切图」这一说了：手指数 ≥ 2 就无条件进 pinch，
      // 不判轴向、不设阈值。所以真正容易出错的是**交界处**——单指横滑到一半
      // 追加第二根手指、以及捏合中途抬起一根，这两处共用同一份
      // scale/tx/ty/swipeX，状态不清理就会残留错位或整幅跳几百 px。
      const gsrc = await (await fetch('./js/gestures.js')).text();
      ok(
        '16.1a 双指无任何轴向/阈值判定（≥2 指无条件进 pinch）',
        /if \(this\.pointers\.size >= 2\) \{\s*event\.preventDefault\(\);\s*this\.updatePinch\(\);\s*return;/.test(
          gsrc
        )
      );
      // 只是文档里提了它当年的名字，不能真有定义或调用
      ok(
        '16.1b 代码里不再残留 updateTwoFinger 的定义或调用',
        !/updateTwoFinger\s*\(/.test(gsrc) && !/function updateTwoFinger/.test(gsrc)
      );
      ok(
        '16.1c 进入捏合前会先把轨道归位（守 swipeX 残留）',
        /beginPinch\(\) \{[\s\S]*?if \(this\.swipeX !== 0\) \{\s*this\.animateTrackTo\(0/.test(
          gsrc
        )
      );
      ok(
        '16.1d 抬起一根时由 releasePinch 接管（而不是空跑 beginPinch）',
        /if \(this\.pointers\.size === 1\) \{\s*this\.releasePinch\(\);/.test(gsrc) &&
          /releasePinch\(\) \{[\s\S]*?this\.mode = 'pan';[\s\S]*?this\.pinch = null;/.test(gsrc)
      );

      // open() 期间手势被临时冻结（防 FLIP 与手势打架），备-手势前要等它恢复
      const tgOpen = async (index = 2) => {
        if (viewer.isOpen) await viewer.close();
        viewer.open(index, null);
        await new Promise((r) => setTimeout(r, 300));
        viewer.g.enabled = true;
        viewer.g.swipeX = 0;
        viewer.g.commit({ scale: 1, tx: 0, ty: 0 });
        return viewer.g;
      };
      const tgX = Math.round(stage.clientWidth / 2);
      const tgY = Math.round(stage.clientHeight / 2);

      // 16.2 双指横向平移：既不分页、也不缩放（间距没变）
      await tgOpen();
      const tgIdx = viewer.index;
      pd('pointerdown', tgX - 100, tgY, 1);
      pd('pointerdown', tgX + 100, tgY, 2);
      pd('pointermove', tgX - 160, tgY, 1);
      pd('pointermove', tgX + 40, tgY, 2); // 整体左移 60，间距仍为 200
      ok('16.2a 双指横向平移 → mode = pinch', viewer.g.mode === 'pinch', String(viewer.g.mode));
      ok('16.2b 双指横向平移 → 不切换图片', viewer.index === tgIdx, `${tgIdx} → ${viewer.index}`);
      ok('16.2c 双指横向平移 → 缩放保持 1', Math.abs(viewer.g.scale - 1) < 0.01, String(viewer.g.scale.toFixed(3)));
      pd('pointerup', tgX - 160, tgY, 1);
      pd('pointerup', tgX + 40, tgY, 2);
      await viewer.g.springBack();

      // 16.3 单指横滑中途追加第二根手指 → 轨道必须归位
      await tgOpen();
      pd('pointerdown', tgX + 220, tgY, 1);
      pd('pointermove', tgX + 20, tgY, 1);
      ok('16.3a 单指先进入 swipe', viewer.g.mode === 'swipe', String(viewer.g.mode));
      ok('16.3b swipeX 跟手 -200', Math.abs(viewer.g.swipeX + 200) < 2, String(viewer.g.swipeX));
      pd('pointerdown', tgX + 120, tgY, 2);
      ok('16.3c 第二指落下立即清零 swipeX', viewer.g.swipeX === 0, String(viewer.g.swipeX));
      pd('pointermove', tgX + 60, tgY, 1);
      pd('pointermove', tgX + 180, tgY, 2);
      pd('pointerup', tgX + 60, tgY, 1);
      pd('pointerup', tgX + 180, tgY, 2);
      await viewer.g.springBack();
      // 读回来的样式已被浏览器序列化成 "...px, 0px, 0px"，比较取值而不是串
      const tgTrackPx = Number(
        (viewer.track.style.transform.match(/translate3d\(([-\d.]+)px/) || [])[1]
      );
      ok(
        '16.3d 松手后轨道停在基准位（不残留半张图的偏移）',
        viewer.g.swipeX === 0 && Math.abs(tgTrackPx - viewer.trackOffset) < 0.5,
        `swipeX=${viewer.g.swipeX} track=${viewer.track.style.transform} base=${viewer.trackOffset}`
      );

      // 16.4 捏合中途抬起「建立基准的那根」手指 → 剩余手指接着拖不能跳
      await tgOpen();
      await viewer.g.zoomTo(2, { x: 0, y: 0 }, false);
      pd('pointerdown', tgX - 100, tgY, 1); // id1 建立 this.start
      pd('pointerdown', tgX + 100, tgY, 2);
      pd('pointermove', tgX - 110, tgY, 1);
      pd('pointermove', tgX + 90, tgY, 2);
      const tgRaw = viewer.g.rawX;
      pd('pointerup', tgX - 110, tgY, 1); // 抬掉 id1，留 id2
      ok('16.4a 抬起一根后 mode 从 pinch 复位为 pan', viewer.g.mode === 'pan', String(viewer.g.mode));
      pd('pointermove', tgX + 70, tgY, 2); // id2 继续左移 20
      ok(
        '16.4b 画面按剩余手指的位移走（不会混进两指间距）',
        Math.abs(viewer.g.rawX - (tgRaw - 20)) < 3,
        `${tgRaw.toFixed(1)} → ${viewer.g.rawX.toFixed(1)}，期望 ${(tgRaw - 20).toFixed(1)}`
      );
      pd('pointerup', tgX + 70, tgY, 2);
      await viewer.g.springBack();
      await viewer.close();

      // ---- 17. 触控板双指横向滑动（macOS trackpad）------------------------
      // Mac 的多指手势到 DOM 之前就被系统翻译成了 wheel / ctrl+wheel / click，
      // pointer 里永远凑不出第二个 pointerId —— 所以这条功能只有一个入口：
      // wheel 的 deltaX。这里全程用真实的 WheelEvent 派发来验证。
      // wheel 事件默认补上 `webkitDirectionInvertedFromDevice = true`：
      // headless 里这个属性恒为 false（Chromium 的已知缺陷），会被我们的归一化
      // 当成「用户关闭了自然滚动」的机器；而 macOS 出厂默认是开启的那一类。
      // 17.9 会单独构造缺失该属性的版本，覆盖另一种设置。
      const wheel = (opts) => {
        const { inverted = true, ...rest } = opts;
        const ev = new WheelEvent('wheel', {
          bubbles: true,
          cancelable: true,
          clientX: startX,
          clientY: startY,
          ...rest
        });
        if (inverted) {
          Object.defineProperty(ev, 'webkitDirectionInvertedFromDevice', {
            value: true
          });
        }
        viewer.track.dispatchEvent(ev);
        return ev;
      };
      // 每个场景都从「干净的一次手势」起步：tgOpen 会重建 Gestures，而真实
      // 使用情况里状态是跨实例交接的（下一节的 17.2 会专门核对这一点），
      // 所以这里必须显式清一次 —— 否则上一个场景把轴锁成横向会串到下一个场景。
      const twOpen = async (index = 2) => {
        const g = await tgOpen(index);
        g.resetWheelSwipe();
        return g;
      };
      const awaitGo = async () => {
        for (let i = 0; i < 20 && viewer.switching; i += 1) await sleep(20);
        await sleep(20);
      };

      /**
       * 一次典型的触控板轻甩：起手加速 → 抬手后的惯性尾巴（合计 ~285px）。
       * 全程 16ms 一帧，中间没有任何静默 —— 对状态机来说这就是「一整段流」。
       */
      const flickDeltas = [4, 9, 16, 24, 30, 34, 32, 28, 24, 20, 16, 13, 10, 8, 6, 4, 3, 2, 1];
      const swipeOnce = async (sign = -1, gap = 16) => {
        for (const d of flickDeltas) {
          await sleep(gap);
          wheel({ deltaX: sign * d, deltaY: 0 });
        }
      };
      /**
       * 慢拖：40ms 一帧、每帧 6~20px（≈0.2px/ms，远低于「甩」的 0.45）。
       * 这种节奏下不该提前结算，画面要一路跟着手走 —— 跟手度就在这里量。
       */
      const slowDrag = async (deltas, gap = 40) => {
        for (const d of deltas) {
          await sleep(gap);
          wheel({ deltaX: d, deltaY: 0 });
        }
      };
      /** 等「流停 → 结算」：结算窗口 65ms + 收尾动画 */
      const settle = async (ms = 200) => {
        await sleep(ms);
        await awaitGo();
      };

      // 17.1 跟手：慢拖时画面逐帧跟着手走，松手时才收尾
      await twOpen(2);
      const base17 = viewer.index;
      await sleep(16);
      const evTiny = wheel({ deltaX: 3, deltaY: 0 });
      ok(
        '17.1a 死区内的噪点既不跟手也不消费（默认行为不被阻断）',
        viewer.g.swipeX === 0 && evTiny.defaultPrevented === false,
        `swipeX=${viewer.g.swipeX} prevented=${evTiny.defaultPrevented}`
      );

      // 17.1b 跟手度：逐事件比对「轨道位移 vs 累计手势位移」
      // 先把上一段那一下 +3px 的噪声清掉（否则它会并进同一段手势的累积里，
      // 让「跟手度」这条断言凭空多出 3px 误差）
      viewer.g.resetWheelSwipe();
      let acc = 0;
      let worst = 0;
      const samples = [];
      for (const d of [6, 7, 8, 9, 10, 11]) {
        await sleep(40);
        wheel({ deltaX: d, deltaY: 0 });
        acc -= d; // 探针的 deltaX 为正 = 手指向左 = 内部 dx 为负
        if (Math.abs(acc) > 8) {
          worst = Math.max(worst, Math.abs(viewer.g.swipeX - acc));
          samples.push(`${acc}:${Math.round(viewer.g.swipeX)}`);
        }
      }
      ok(
        '17.1b 跟手度：每个事件的轨道位移都等于累计手势位移（误差 < 1px）',
        worst < 1,
        `最大误差 ${worst.toFixed(2)}px ${samples.join(' ')}`
      );

      await sleep(40); // 与上一帧一样的节奏，否则会被算成「同帧内的第二个事件」
      const evFollow = wheel({ deltaX: 12, deltaY: 0 });
      ok('17.1c 跟手的那几帧就已经 preventDefault', evFollow.defaultPrevented === true);
      ok('17.1d 这一段还没停 → 不结算', viewer.index === base17, String(viewer.index));

      await settle();
      ok(
        '17.1e 位移不够（≈63px）：松手回弹，不翻页',
        viewer.index === base17 && viewer.g.swipeX === 0,
        `index=${viewer.index} swipeX=${viewer.g.swipeX}`
      );

      // 17.1f 甩：一段流还没停就该切图（不等静默窗口 = 不迟钝）
      await twOpen(2);
      const quickBefore = viewer.index;
      for (let i = 0; i < 4; i += 1) {
        await sleep(16);
        wheel({ deltaX: 40, deltaY: 0 });
      }
      ok(
        '17.1f 甩到门槛就在流里切图（不陪惯性尾巴耗时间）',
        viewer.index === quickBefore + 1,
        `${quickBefore} → ${viewer.index}`
      );
      await settle();

      // 17.1g 起手噪声不能把整段横滑钉成缩放（「第一次滑不动」的真因）
      await twOpen(2);
      const noiseBefore = viewer.index;
      await sleep(16);
      wheel({ deltaX: 3, deltaY: 4 }); // 起手那两帧：纵向略大
      await sleep(16);
      wheel({ deltaX: 4, deltaY: 3 });
      for (const d of [20, 30, 40]) {
        await sleep(16);
        wheel({ deltaX: d, deltaY: 0 });
      }
      await settle();
      ok(
        '17.1g 起手噪声（dx=3/dy=4）不会把整段横滑误判成缩放',
        viewer.index === noiseBefore + 1 && Math.abs(viewer.g.scale - 1) < 0.02,
        `index ${noiseBefore} → ${viewer.index}，scale=${viewer.g.scale.toFixed(3)}`
      );

      // 17.2 一次手势只翻一张：推得再远也不连翻（上一版连翻的回归用例）
      await twOpen(1);
      const longBefore = viewer.index;
      for (let i = 0; i < 40; i += 1) {
        await sleep(16);
        wheel({ deltaX: 25, deltaY: 0 }); // 推的阶段：每帧 25px，连推 40 帧
      }
      for (const d of [22, 19, 16, 13, 10, 8, 6, 4, 3, 2]) {
        await sleep(16);
        wheel({ deltaX: d, deltaY: 0 });
      }
      ok(
        '17.2a 一次长距离横滑（推 + 惯性尾巴）只翻一张',
        viewer.index === longBefore + 1,
        `${longBefore} → ${viewer.index}`
      );
      ok(
        '17.2b 结算之后落锁（同一段不再重来）',
        viewer.g.wheelSwipe.locked === true,
        String(viewer.g.wheelSwipe.locked)
      );

      // 17.2c 同一段还没停（中间没有静默）就继续堆位移，也不会多给一张
      for (let i = 0; i < 10; i += 1) {
        await sleep(16);
        wheel({ deltaX: 25, deltaY: 0 });
      }
      ok(
        '17.2c 同一段里继续堆位移不连翻',
        viewer.index === longBefore + 1,
        `${longBefore} → ${viewer.index}`
      );
      await settle(400);

      // 17.3 抬手（静默）之后再滑：必须立刻还能翻 —— 「不灵敏」的回归点
      const chainBefore = viewer.index;
      await swipeOnce(1);
      await settle();
      ok('17.3a 抬手后再滑立刻翻一张', viewer.index === chainBefore + 1, `${chainBefore} → ${viewer.index}`);
      const chain2 = viewer.index;
      await swipeOnce(1);
      await settle();
      ok('17.3b 连着第二下同样响应', viewer.index === chain2 + 1, `${chain2} → ${viewer.index}`);

      // 17.4 结算撞上切图动画（enabled=false）：要等动画跑完，不能把这一下丢掉
      await twOpen(2);
      const busyIdx = viewer.index;
      viewer.g.enabled = false; // 复现「结算时切换动画还在跑」
      await slowDrag(new Array(17).fill(20)); // 340px > 22% × 视口
      await sleep(120);
      ok('17.4a 动画没跑完时先不结算', viewer.index === busyIdx, String(viewer.index));
      viewer.g.enabled = true;
      await settle(240);
      ok('17.4b 动画一结束就补上这一次（输入没丢）', viewer.index === busyIdx + 1, String(viewer.index));

      // 17.5 反方向 → 上一张
      await twOpen(3);
      await swipeOnce(-1);
      await settle();
      ok('17.5 反方向滑动切回上一张', viewer.index === 2, String(viewer.index));

      // 17.6 纵向主导必须是缩放（不能一边缩放一边翻页）
      await twOpen(2);
      const beforeAxis = viewer.index;
      // deltaY > 0 在「自然滚动」开启的机器上是内容向上、也就是手指向上 ·
      // 与其它入口一致的惯例是：手指向上 = 放大
      wheel({ deltaX: 10, deltaY: 60 });
      await sleep(20);
      ok(
        '17.6a 纵向主导 → 走缩放（手指向上 = 放大）',
        viewer.g.scale > 1.05,
        viewer.g.scale.toFixed(3)
      );
      ok('17.6b 纵向主导不翻页', viewer.index === beforeAxis, String(viewer.index));

      // 17.7 已放大 → 横向是平移，不是翻页
      await twOpen(2);
      await viewer.g.zoomTo(2, { x: 0, y: 0 }, false);
      const panBefore = viewer.g.rawX;
      wheel({ deltaX: 30, deltaY: 0 });
      await sleep(20);
      ok(
        '17.7a 放大态下横向 wheel 平移画面（内容跟着滑动方向走）',
        Math.abs(viewer.g.rawX - (panBefore - 30)) < 1,
        `${panBefore.toFixed(1)} → ${viewer.g.rawX.toFixed(1)}，期望 ${(panBefore - 30).toFixed(1)}`
      );
      ok('17.7b 放大态下横向 wheel 不翻页', viewer.index === 2, String(viewer.index));

      // 17.8 到首尾：给回弹而不是静默吞掉
      await twOpen(0);
      clearAnimations();
      await swipeOnce(-1);
      await settle(300);
      ok('17.8a 第一张继续往前不切图', viewer.index === 0, String(viewer.index));
      await sleep(80);
      ok(
        '17.8b 到头时有回弹反馈（不是毫无动静）',
        lastOf(viewer.track) !== null,
        String(lastOf(viewer.track)?.options?.duration)
      );

      // 17.9 右边缘留给 macOS 通知中心
      await twOpen(2);
      wheel({ deltaX: 40, deltaY: 0, clientX: window.innerWidth - 8 });
      wheel({ deltaX: 40, deltaY: 0, clientX: window.innerWidth - 8 });
      await settle(300);
      ok(
        '17.9 右边缘起手不切图（让给通知中心）',
        viewer.index === 2,
        String(viewer.index)
      );

      // 17.10 捏合（ctrl+wheel）与横滑互斥
      await twOpen(2);
      wheel({ deltaX: 40, deltaY: 0, ctrlKey: true });
      await settle(300);
      ok('17.10 捏合期间不切图', viewer.index === 2, String(viewer.index));

      // 17.11 方向与 macOS「滚动方向：自然」开关无关：
      //      同一个 +24 在两种设置下代表的物理手势是相反的，归一化之后
      //      「手指向左」必须都落到「下一张」。这曾经反过：写反了符号。
      await twOpen(2);
      const raw = new WheelEvent('wheel', {
        bubbles: true,
        cancelable: true,
        // 不定义 webkitDirectionInvertedFromDevice —— 模拟「自然滚动」已关闭
        // 的机器（本机正是如此：com.apple.swipescrolldirection = 1）
        deltaX: 24,
        deltaY: 0,
        clientX: startX,
        clientY: startY
      });
      await sleep(16);
      viewer.track.dispatchEvent(raw);
      await sleep(16);
      viewer.track.dispatchEvent(new WheelEvent('wheel', {
        bubbles: true, cancelable: true, deltaX: 40, deltaY: 0, clientX: startX, clientY: startY
      }));
      await sleep(16);
      viewer.track.dispatchEvent(new WheelEvent('wheel', {
        bubbles: true, cancelable: true, deltaX: 44, deltaY: 0, clientX: startX, clientY: startY
      }));
      await settle(300);
      ok(
        '17.11a 自然滚动关闭时向左划 = 上一张',
        viewer.index === 1,
        String(viewer.index)
      );

      await twOpen(2);
      await swipeOnce(1);
      await settle();
      ok(
        '17.11b 自然滚动开启时向左划 = 下一张',
        viewer.index === 3,
        String(viewer.index)
      );

      // 17.12 胶片条不在 wheel 的作用域里：那里的横向语义是滚缩略图
      await twOpen(2);
      const trackBox = viewer.track.getBoundingClientRect();
      const stripBox = viewer.strip.root.getBoundingClientRect();
      ok(
        '17.12a 胶片条不在 track 内（wheel 监听收不到它的事件）',
        viewer.track.contains(viewer.strip.root) === false
      );
      ok(
        '17.12b 胶片条与轨道区域不重叠',
        stripBox.top >= trackBox.bottom - 1,
        `strip.top=${Math.round(stripBox.top)} track.bottom=${Math.round(trackBox.bottom)}`
      );

      // 17.13 只有一张图时横向毫无意义：既不切图，也不给（会把黑边拉出来的）回弹
      viewer.setItems([items[2]]);
      await twOpen(0);
      clearAnimations();
      await swipeOnce(-1);
      await settle(300);
      await sleep(80);
      ok('17.13a 单图时横向不切图', viewer.index === 0, String(viewer.index));
      ok(
        '17.13b 单图时不给回弹（邻槽是空的，回弹会把黑边拉出来）',
        lastOf(viewer.track) === null,
        String(lastOf(viewer.track)?.options?.duration)
      );
      ok('17.13c 单图时也不跟手', viewer.g.swipeX === 0, String(viewer.g.swipeX));
      viewer.setItems(items);

      // 17.14 连续切换之后不跟手的真因：**上一次的收尾动画还在跑**。
      //      切图的收尾动画跑在 track 上（WAAPI），关键帧优先级高于内联样式：
      //      动画没播完时手势写进 style.transform 的那笔位移是看不见的，要等
      //      动画结束才突然生效 —— 表现为「按下去不动，过一下才跳过去」。
      //      探针里的 animate 替身是「立即完成」的，所以要手工造出动画跑到
      //      一半的现场（真机上这才是连续快切时的常态）。
      const visualX = (el) => {
        const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
        return Number.isFinite(m.m41) ? m.m41 : 0;
      };

      await twOpen(2);
      const W17 = viewer.slotWidth();
      const mid17 = -1.35 * W17; // 画面停在「两张图各露一部分」
      viewer.switching = true; // go() 还没结束
      viewer.g.enabled = false; // 动画期间的闸门
      viewer.slotIndex = 2; // 目标槽已经从右边推进来
      viewer.trackOffset = -2 * W17;
      viewer.track.style.transform = `translate3d(${mid17}px, 0, 0)`;
      let cancelled17 = false;
      viewer.trackAnim = {
        playState: 'running',
        cancel() {
          cancelled17 = true;
        }
      };

      await sleep(16);
      wheel({ deltaX: 40, deltaY: 0 }); // 只推 40px：远不够翻页
      await sleep(16);
      ok(
        '17.14a 起手就接管（还在跑的收尾动画被取消）',
        cancelled17 && viewer.trackAnim === null,
        `cancelled=${cancelled17} trackAnim=${String(viewer.trackAnim)}`
      );
      ok(
        '17.14b 接管后画面从刚才停的位置继续跟手（不跳、也不被关键帧盖住）',
        Math.abs(visualX(viewer.track) - (mid17 - 40)) < 2,
        `视觉 ${visualX(viewer.track).toFixed(1)}，期望 ${(mid17 - 40).toFixed(1)}`
      );
      ok(
        '17.14c 接管后立刻解除 switching / enabled（不必再等一次动画）',
        viewer.switching === false && viewer.g.enabled === true,
        `switching=${viewer.switching} enabled=${viewer.g.enabled}`
      );
      ok(
        '17.14d 接管偏移不参与阈值（只推了 40px，不该结算）',
        viewer.index === 2,
        String(viewer.index)
      );
      await settle(300);

      // 17.14e 连续三次「切到一半就再起手」：每一段都必须重新对齐。
      //       每轮只推 12px（40ms 一帧）：低于「擦过 28px + 峰值速度」的结算
      //       门槛，避免异步的 go() 插手，这样纯粹检验接管的视觉连续性。
      await twOpen(1);
      let drift17 = 0;
      const trace17 = [];
      for (let i = 0; i < 3; i += 1) {
        const W = viewer.slotWidth();
        const from = -(1.35 + i * 0.1) * W;
        viewer.switching = true;
        viewer.g.enabled = false;
        viewer.slotIndex = 2;
        viewer.trackOffset = -2 * W;
        viewer.track.style.transform = `translate3d(${from}px, 0, 0)`;
        viewer.trackAnim = { playState: 'running', cancel() {} };
        await sleep(16);
        wheel({ deltaX: 12, deltaY: 0 });
        await sleep(40);
        const got = visualX(viewer.track);
        drift17 = Math.max(drift17, Math.abs(got - (from - 12)));
        trace17.push(
          `#${i} from=${from.toFixed(0)} got=${got.toFixed(0)} swipeX=${viewer.g.swipeX.toFixed(
            0
          )} base=${String(viewer.g.wheelSwipe.base)} off=${viewer.trackOffset.toFixed(0)} W=${W}`
        );
        await settle(300);
      }
      ok(
        '17.14e 连续三次切图中起手，画面与手势始终对齐（误差 < 2px）',
        drift17 < 2,
        `最大误差 ${drift17.toFixed(2)}px｜${trace17.join('｜')}`
      );

      // 17.15 回弹被打断：必须接住回弹中途的那一截。
      //       没达标的那一段会回弹 200ms；回弹是 WAAPI 关键帧，优先级高于内联
      //       样式 —— 掐掉它的瞬间视觉会掉回内联值（= 0 偏移），那段没走完的
      //       位移就整段消失了。探针里 animate 是「立刻完成」的替身，所以这里
      //       手工把画面摆到回弹中途（真机上这就是「半滑回弹后又立刻再滑」）。
      await twOpen(2);
      const mid15 = -90; // 未达标的那一段推出去的位移
      viewer.track.style.transform = `translate3d(${viewer.trackOffset + mid15}px, 0, 0)`;
      let cancelled15 = false;
      viewer.g.anim = {
        cancel() {
          cancelled15 = true;
        }
      };
      const vis15before = visualX(viewer.track);
      await sleep(16);
      wheel({ deltaX: 30, deltaY: 0 }); // 回弹还没播完就再滑
      await sleep(16);
      ok('17.15a 打断回弹前先掐掉那个动画', cancelled15 === true, String(cancelled15));
      ok(
        '17.15b 从画面实际所在的位置接着跟手（不往回跳）',
        Math.abs(visualX(viewer.track) - (vis15before - 30)) < 2,
        `视觉 ${visualX(viewer.track).toFixed(1)}，期望 ${(vis15before - 30).toFixed(1)}`
      );
      ok(
        '17.15c 接管偏移 = 回弹中途的位置（不是写死的 0）',
        Math.abs(viewer.g.wheelSwipe.base - mid15) < 2,
        String(viewer.g.wheelSwipe.base)
      );
      ok('17.15d 打断回弹本身不会误翻页', viewer.index === 2, String(viewer.index));
      await settle(300);

      await viewer.close();

      } catch (error) {
        log.push(`THREW ${error && error.stack ? error.stack.split('\n')[0] : String(error)}`);
      }
      out.textContent = log.join('\n');
      document.title = log.some((l) => l.startsWith('FAIL') || l.startsWith('THREW'))
        ? 'HAS-FAIL'
        : 'ALL-PASS';
    </script>
  </body>
</html>
