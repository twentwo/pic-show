[package]
name = "picshow"
version = "0.1.4"
description = "PicShow - 沉浸式跨平台照片查看器"
authors = ["PicShow"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "picshow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心运行时
tauri = { version = "2", features = ["devtools"] }
# 系统文件/文件夹选择对话框（在 Rust 侧调用，前端无需引入 JS 插件）
tauri-plugin-dialog = "2"
# 用系统默认程序打开路径（"在访达中显示" 等）
tauri-plugin-opener = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 图像解码 / 缩放 / 编码
image = "0.25"

# 缓存：带权重（按字节计）的 LRU
moka = { version = "0.12", features = ["sync"] }
# 并行扫描与并行缩略图生成
rayon = "1"
walkdir = "2"
# 锁
parking_lot = "0.12"

# macOS 专用：给无边框窗口补回原生全屏能力，并在「打开方式」退出时把桌面与
# 焦点交还给触发打开的那个应用（详见 src/macos.rs）。
# 版本跟着 tao 内部用的那份走，属于同一个已编译依赖，不会带来额外构建成本。
# NSWorkspace / NSRunningApplication / libc 三个 feature 只为读前台应用与按 pid
# 找回它，都是同一个已编译 crate 里的模块，不引入新的三方依赖。
#
# NSEvent + block2 供 `src/wheel_phase.rs` 的原生相位主判据使用（默认开启）：
# addLocalMonitorForEventsMatchingMask:handler: 的绑定带 block 参数，需要这两个
# feature。block2 本来就是 tao/objc2-app-kit 的依赖（lock 里已有 0.6.2），
# 这里只是显式声明直接依赖，不新增编译单元。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSWorkspace",
    "NSRunningApplication",
    "NSEvent",
    "block2",
    "libc",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
