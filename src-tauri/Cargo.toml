[package]
name = "picshow"
version = "0.1.0"
description = "PicShow - 沉浸式跨平台照片查看器"
authors = ["PicShow"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "picshow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心运行时
tauri = { version = "2", features = ["devtools"] }
# 系统文件/文件夹选择对话框（在 Rust 侧调用，前端无需引入 JS 插件）
tauri-plugin-dialog = "2"
# 用系统默认程序打开路径（"在访达中显示" 等）
tauri-plugin-opener = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 图像解码 / 缩放 / 编码
image = "0.25"

# 缓存：带权重（按字节计）的 LRU
moka = { version = "0.12", features = ["sync"] }
# 并行扫描与并行缩略图生成
rayon = "1"
walkdir = "2"
# 锁
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
